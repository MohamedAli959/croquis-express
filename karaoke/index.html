<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#fff8ec">
<title>Karaoké Battle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fff8ec; --ink:#2b2340; --soft:#6b6385; --line:#e7dcc8;
    --pop:#a259ff; --hot:#ff5d73; --sun:#ffc145; --mint:#2ec4b6; --sky:#4f7cff; --card:#ffffff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif}
  body{background-image:radial-gradient(#eadfcb 1px,transparent 1px);background-size:22px 22px}
  #app{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding:16px}
  h1{font-size:38px;margin:8px 0 2px;letter-spacing:-.5px;line-height:1}
  h1 span{color:var(--pop)}
  h2{font-size:26px;margin:4px 0 8px;line-height:1.15}
  p{margin:6px 0;color:var(--soft);line-height:1.4}
  a{color:var(--sky)}
  .hand{font-family:'Patrick Hand',cursive}
  .back{color:var(--soft);text-decoration:none;font-weight:600;font-size:15px;align-self:flex-start}
  .card{background:var(--card);border:2px solid var(--ink);border-radius:18px;padding:16px;box-shadow:4px 4px 0 var(--ink);margin:10px 0}
  .btn{appearance:none;display:block;text-align:center;text-decoration:none;border:2px solid var(--ink);background:var(--sun);color:var(--ink);font:600 18px 'Fredoka',sans-serif;
       padding:14px 18px;border-radius:14px;box-shadow:3px 3px 0 var(--ink);cursor:pointer;width:100%;transition:transform .05s}
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .btn.pop{background:var(--pop);color:#fff}
  .btn.hot{background:var(--hot);color:#fff}
  .btn.mint{background:var(--mint);color:#fff}
  .btn.sky{background:var(--sky);color:#fff}
  .btn.ghost{background:#fff}
  .btn.small{font-size:15px;padding:9px 12px;width:auto;display:inline-block}
  .row{display:flex;gap:10px;align-items:center}
  .row > *{flex:1}
  .stack{display:flex;flex-direction:column;gap:10px}
  .spacer{flex:1}
  label.lbl{font-weight:600;font-size:15px;display:block;margin:6px 0 6px}
  input[type=text],input[type=url]{width:100%;min-width:0;font:500 18px 'Fredoka',sans-serif;padding:11px 12px;border:2px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink)}
  input:focus{outline:3px solid var(--sun)}
  .seg{display:flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}
  .seg button{flex:1;border:0;background:#fff;font:600 15px 'Fredoka';padding:10px 4px;color:var(--ink);cursor:pointer}
  .seg button+button{border-left:2px solid var(--ink)}
  .seg button.on{background:var(--ink);color:#fff}
  .pl{display:flex;gap:8px;align-items:center;min-height:34px;margin-bottom:6px}
  .pl .pname{flex:1;font-weight:500;font-size:18px}
  .dot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--ink)}
  .x{border:2px solid var(--ink);background:#fff;border-radius:10px;width:36px;height:34px;font-size:18px;cursor:pointer;flex:none;color:var(--ink)}
  .center{text-align:center}
  .big-emoji{font-size:64px;line-height:1;margin:10px 0}
  .title{font-size:32px;font-weight:700;color:var(--pop);margin:4px 0;line-height:1.1;word-break:break-word}
  .code{font-size:52px;font-weight:700;letter-spacing:10px;color:var(--pop);line-height:1.1;margin:4px 0}
  .qr img{width:150px;height:150px;image-rendering:pixelated;margin:6px auto 0;display:block}
  .or{text-align:center;color:var(--soft);font-weight:600;margin:12px 0 2px}
  .pill{display:inline-block;border:2px solid var(--ink);border-radius:999px;padding:3px 10px;font-weight:600;font-size:14px;background:#fff}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .bar{height:8px;border:2px solid var(--ink);border-radius:999px;overflow:hidden;background:#fff;margin:8px 0}
  .bar > div{height:100%;background:var(--mint);transition:width .25s linear}
  .challenge{background:var(--sun);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;font-weight:600;font-size:18px;box-shadow:3px 3px 0 var(--ink);margin:8px 0}
  .challenge small{display:block;font-size:13px;font-weight:600;opacity:.7;text-transform:uppercase;letter-spacing:.5px}
  .video{position:relative;width:100%;aspect-ratio:16/9;border:2px solid var(--ink);border-radius:14px;overflow:hidden;background:#000;box-shadow:4px 4px 0 var(--ink)}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .reacts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
  .reacts button{font-size:40px;padding:12px 0;border:2px solid var(--ink);border-radius:16px;background:#fff;box-shadow:3px 3px 0 var(--ink);cursor:pointer;touch-action:manipulation;position:relative}
  .reacts button:active{transform:translate(2px,2px) scale(.95);box-shadow:1px 1px 0 var(--ink)}
  .reacts button span{position:absolute;right:6px;bottom:2px;font:600 13px 'Fredoka';color:var(--soft)}
  .counts{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;font-size:20px;min-height:28px}
  .stars{display:flex;justify-content:center;gap:6px;margin:10px 0}
  .stars button{font-size:46px;background:none;border:0;cursor:pointer;padding:0 2px;color:#d9cfbd;line-height:1;transition:transform .1s}
  .stars button.on{color:var(--sun);text-shadow:0 0 0 var(--ink),2px 2px 0 var(--ink)}
  .stars button:active{transform:scale(1.2)}
  .avg{font-size:56px;font-weight:700;line-height:1;color:var(--pop)}
  .dist{display:flex;flex-direction:column;gap:4px;margin-top:8px}
  .dist div{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft)}
  .dist i{display:block;height:10px;background:var(--sun);border:2px solid var(--ink);border-radius:999px;min-width:4px}
  .score{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:2px dashed var(--line);font-size:18px}
  .score:last-child{border-bottom:0}
  .score b{font-size:22px}
  .hint{font-size:14px;color:var(--soft)}
  .steps{padding-left:20px;margin:6px 0;color:var(--soft);line-height:1.5}
  .pop-in{animation:popin .35s ease-out}
  @keyframes popin{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .shake{animation:shake .35s}
  @keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .floater{position:fixed;bottom:80px;font-size:40px;pointer-events:none;z-index:15;animation:floatup 2.2s ease-out forwards}
  @keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-40px) scale(1.1)}100%{transform:translateY(-60vh) scale(1);opacity:0}}
  .modal{position:fixed;inset:0;background:rgba(43,35,64,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal .card{max-width:420px;width:100%;max-height:90dvh;overflow:auto}
  .toast{position:fixed;left:50%;bottom:20px;transform:translate(-50%,40px);opacity:0;background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;
         font-weight:500;max-width:calc(100% - 32px);text-align:center;transition:all .25s;z-index:30;pointer-events:none}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div id="app"><p class="center" style="margin-top:40vh">Chargement…</p></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
/* ================= Données ================= */
const COLORS=["#a259ff","#ff5d73","#4f7cff","#2ec4b6","#ffc145","#ff8c42","#3bb273","#e84a9b","#00a6ed","#8b5a2b","#6b6385","#f15bb5"];
const EMOJIS=["👏","🔥","😂","😍","🎶","😱"];
// Idées de chansons (titres seulement : les paroles sont sur YouTube)
const SONGS=[
  "Les Champs-Élysées – Joe Dassin","Alexandrie Alexandra – Claude François","Je veux – Zaz","Formidable – Stromae",
  "Alors on danse – Stromae","Ces soirées-là – Yannick","Femme like U – K-Maro","Tous les mêmes – Stromae",
  "La Bohème – Charles Aznavour","Le Lion est mort ce soir – Pow Wow","Il jouait du piano debout – France Gall",
  "Les Démons de minuit – Images","Voyage voyage – Desireless","L'Aventurier – Indochine","Ne partez pas sans moi – Céline Dion",
  "Pour que tu m'aimes encore – Céline Dion","On écrit sur les murs – Kids United","Dernière danse – Indila",
  "Djadja – Aya Nakamura","Bella – Maître Gims","Sapés comme jamais – Maître Gims","Balance ton quoi – Angèle",
  "Bohemian Rhapsody – Queen","Dancing Queen – ABBA","Mamma Mia – ABBA","I Will Survive – Gloria Gaynor",
  "Don't Stop Me Now – Queen","Wannabe – Spice Girls","…Baby One More Time – Britney Spears","Livin' on a Prayer – Bon Jovi",
  "Sweet Caroline – Neil Diamond","Shallow – Lady Gaga & Bradley Cooper","Let It Go – La Reine des neiges",
  "Libérée, délivrée – La Reine des neiges","Hakuna Matata – Le Roi Lion","Billie Jean – Michael Jackson",
  "Total Eclipse of the Heart – Bonnie Tyler","Africa – Toto","Toxic – Britney Spears","Rolling in the Deep – Adele",
  "Despacito – Luis Fonsi","Wonderwall – Oasis","Hey Jude – The Beatles","Ça plane pour moi – Plastic Bertrand",
];

/* ================= Utilitaires ================= */
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=sel=>app.querySelector(sel);
function view(html){ app.innerHTML=html; window.scrollTo(0,0); }
const LS={
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function toast(msg){
  let t=document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),3500);
}
function modal(inner){
  const m=document.createElement("div"); m.className="modal";
  m.innerHTML=`<div class="card pop-in">${inner}</div>`;
  m.onclick=e=>{ if(e.target===m) m.remove(); };
  document.body.appendChild(m); return m;
}
function confirmBox(title,text,yes,onYes){
  const m=modal(`<div class="center"><h2>${title}</h2><p>${text}</p>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-no>Non</button><button class="btn pop" data-yes>${yes}</button></div></div>`);
  m.querySelector("[data-no]").onclick=()=>m.remove();
  m.querySelector("[data-yes]").onclick=()=>{ m.remove(); onYes(); };
}
function floatEmoji(e){
  const f=document.createElement("div"); f.className="floater"; f.textContent=e;
  f.style.left=(10+Math.random()*80)+"vw"; f.style.animationDuration=(1.8+Math.random()*0.8)+"s";
  document.body.appendChild(f); setTimeout(()=>f.remove(),2700);
}
const ytSearch=q=>"https://www.youtube.com/results?search_query="+encodeURIComponent(q+" karaoké");

/* ================= Identité & connexion ================= */
const API="/api/karaoke";
function newId(){
  if(window.crypto && crypto.randomUUID) return crypto.randomUUID();
  return Array.from(crypto.getRandomValues(new Uint8Array(16)),b=>b.toString(16).padStart(2,"0")).join("");
}
let myId=LS.get("cx-id");                          // même identifiant que Croquis Express
if(!myId || !/^[A-Za-z0-9-]{8,64}$/.test(myId)){ myId=newId(); LS.set("cx-id",myId); }
let myName=LS.get("cx-name")||"";

let code=null, R=null, offset=0, screenKey="", onUpdate=null, cleanup=[];
let pollT=null, pollGen=0, busy=false;

const sNow=()=>Date.now()+offset;
const roundTag=()=>R.state.game+"-"+R.state.round;
const votersOf=s=>s.order.filter(id=>id!==s.singer);
const nameOf=id=>{ const p=R && R.players.find(p=>p.id===id); return p?p.name:"Joueur parti"; };
function colorOf(id){
  const s=R.state;
  let i=s.phase!=="lobby" && s.order ? s.order.indexOf(id) : -1;
  if(i<0) i=R.players.findIndex(p=>p.id===id);
  return COLORS[Math.max(0,i)%COLORS.length];
}
const who=id=>`<b style="color:${colorOf(id)}">${esc(nameOf(id))}</b>`;

async function call(action,data={}){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({action,code,id:myId,name:myName,...data})});
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j && j.error) || ("Erreur serveur ("+r.status+")"));
  return j;
}
function apply(j){
  if(!j || !j.state || !code || j.state.code!==code) return;
  if(R && R.state.code===j.state.code && j.state.v < R.state.v) return;
  R=j; offset=j.now-Date.now(); render();
}
async function act(action,data,btn){
  if(busy) return null;
  busy=true; if(btn) btn.disabled=true;
  try{ const j=await call(action,data); apply(j); return j; }
  catch(e){ toast(e.message); return null; }
  finally{ busy=false; if(btn && btn.isConnected) btn.disabled=false; }
}
function startPolling(){ pollGen++; clearTimeout(pollT); pollLoop(pollGen); }
async function pollLoop(g){
  if(g!==pollGen || !code) return;
  const c=code;
  try{
    const r=await fetch(`${API}?code=${c}&id=${encodeURIComponent(myId)}`,{cache:"no-store"});
    if(g!==pollGen || c!==code) return;
    if(r.status===404){ leaveLocal("Cette partie n'existe plus."); return; }
    const j=await r.json();
    if(r.ok) apply(j); else if(j && j.error) toast(j.error);
  }catch(e){}
  if(g===pollGen && code) pollT=setTimeout(()=>pollLoop(g), document.hidden?5000:1000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && code){ startPolling(); keepAwake(); } });
let wakeLock=null;
async function keepAwake(){
  try{ if(code && "wakeLock" in navigator && !wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null); } }catch(e){}
}
function enterRoom(j){
  code=j.state.code; LS.set("ka-room",code);
  history.replaceState(null,"","?r="+code);
  R=null; screenKey=""; apply(j); startPolling(); keepAwake();
}
function leaveLocal(msg){
  code=null; R=null; screenKey=""; pollGen++; clearTimeout(pollT); runCleanup();
  LS.del("ka-room"); history.replaceState(null,"",location.pathname);
  if(wakeLock){ wakeLock.release().catch(()=>{}); wakeLock=null; }
  home(); if(msg) toast(msg);
}
function quitGame(){
  confirmBox("Quitter la partie ?", R && R.state.phase!=="lobby" ? "Les autres continueront sans toi." : "Tu pourras revenir avec le code.", "Oui", ()=>{
    call("leave").catch(()=>{}); leaveLocal();
  });
}

/* ================= Réactions ================= */
let pendingR={}, flushT=null, seen={tag:"",c:{}};
function sendReaction(e){
  floatEmoji(e);
  if(navigator.vibrate) navigator.vibrate(15);
  const s=R.state;
  seen.c[e]=(seen.c[e]||0)+1;                 // on ne ré-affichera pas notre propre réaction
  pendingR[e]=(pendingR[e]||0)+1;
  if(!flushT) flushT=setTimeout(async()=>{
    const r=pendingR; pendingR={}; flushT=null;
    try{ await call("react",{game:s.game,round:s.round,r}); }catch(err){}
  },700);
}
// Fait apparaître les réactions des autres
function showNewReactions(){
  if(!R) return;
  const tag=roundTag(), react=R.react||{};
  if(seen.tag!==tag){ seen={tag,c:{...react}}; return; }
  for(const e of EMOJIS){
    const diff=(react[e]||0)-(seen.c[e]||0);
    if(diff>0){ for(let i=0;i<Math.min(diff,6);i++) setTimeout(()=>floatEmoji(e),i*180); seen.c[e]=react[e]; }
  }
}
const countsHTML=()=>EMOJIS.filter(e=>(R.react||{})[e]).map(e=>`<span>${e} ${R.react[e]}</span>`).join("");

/* ================= Routage des écrans ================= */
function runCleanup(){ cleanup.forEach(f=>{ try{ f(); }catch(e){} }); cleanup=[]; onUpdate=null; }
function every(ms,f){ const h=setInterval(f,ms); cleanup.push(()=>clearInterval(h)); f(); }

function render(){
  if(!code || !R) return;
  const s=R.state;
  if(!R.players.some(p=>p.id===myId)){ leaveLocal("Tu ne fais plus partie de cette partie."); return; }
  const me=s.singer===myId;
  let key, fn;
  if(s.phase==="lobby"){ key="lobby:"+JSON.stringify([s.game,R.players,s.settings,s.host]); fn=lobbyScreen; }
  else if(s.phase==="pick"){ key=`pick:${roundTag()}:${me}`; fn=me?pickScreen:waitPickScreen; }
  else if(s.phase==="sing"){ key=`sing:${roundTag()}:${me}`; fn=me?singScreen:audienceScreen; }
  else if(s.phase==="vote"){ const v=R.voted.includes(myId); key=`vote:${roundTag()}:${me?"s":v}`; fn=me?singerWaitVoteScreen:v?votedScreen:voteScreen; }
  else if(s.phase==="result"){ key=`result:${roundTag()}`; fn=resultScreen; }
  else { key=`final:${s.game}`; fn=finalScreen; }
  if(key!==screenKey){ screenKey=key; runCleanup(); fn(); }
  if(s.phase==="sing" || s.phase==="vote") showNewReactions();
  if(onUpdate) onUpdate();
}

/* ================= Accueil ================= */
function home(){
  runCleanup(); screenKey="";
  const inv=(new URLSearchParams(location.search).get("r")||"").toUpperCase().replace(/[^A-Z]/g,"").slice(0,4);
  view(`
    <a href="/" class="back">← Tous les jeux</a>
    <h1>Karaoké <span>Battle</span> 🎤</h1>
    <p class="hand" style="font-size:20px">Chacun son tour au micro, les autres réagissent en direct et notent la performance. Qui sera la star de la soirée ?</p>
    <div class="card">
      <label class="lbl" for="nm">Ton prénom</label>
      <input type="text" id="nm" maxlength="16" placeholder="Ex : Léa" value="${esc(myName)}" autocomplete="nickname">
    </div>
    ${inv ? `
      <div class="card stack center">
        <p style="margin:0">On t'invite dans la partie</p>
        <div class="code">${inv}</div>
        <button class="btn pop" id="join">Rejoindre la partie</button>
      </div>
      <button class="btn ghost" id="other">Créer ma propre partie</button>
    ` : `
      <button class="btn pop" id="create" style="margin-top:6px">Créer une partie</button>
      <div class="or">— ou —</div>
      <div class="card">
        <label class="lbl" for="cd">Rejoindre avec un code</label>
        <form class="row" id="jf">
          <input type="text" id="cd" maxlength="4" placeholder="ABCD" autocomplete="off" autocapitalize="characters" spellcheck="false"
                 style="flex:2;text-transform:uppercase;letter-spacing:6px;font-weight:700;text-align:center">
          <button class="btn mint" style="flex:1">Rejoindre</button>
        </form>
      </div>
    `}
    <button class="btn ghost" id="rules" style="margin-top:10px">Comment on joue ?</button>
    <div style="height:20px"></div>
  `);
  const nm=$("#nm");
  const readName=()=>{
    myName=nm.value.trim().replace(/\s+/g," ").slice(0,16);
    if(!myName){ nm.focus(); nm.classList.remove("shake"); void nm.offsetWidth; nm.classList.add("shake"); toast("Entre ton prénom d'abord"); return false; }
    LS.set("cx-name",myName); return true;
  };
  const go=async(action,c,btn)=>{
    if(!readName()) return;
    if(action==="join" && !/^[A-Z]{4}$/.test(c)){ toast("Le code fait 4 lettres"); return; }
    btn.disabled=true; code=c;
    try{ enterRoom(await call(action)); }
    catch(e){ code=null; toast(e.message); btn.disabled=false; }
  };
  if(inv){
    $("#join").onclick=e=>go("join",inv,e.currentTarget);
    $("#other").onclick=()=>{ history.replaceState(null,"",location.pathname); home(); };
    if(!myName) nm.focus();
  }else{
    $("#create").onclick=e=>go("create",null,e.currentTarget);
    $("#jf").onsubmit=e=>{ e.preventDefault(); go("join",$("#cd").value.toUpperCase().replace(/[^A-Z]/g,""),e.target.querySelector("button")); };
  }
  $("#rules").onclick=rules;
}

function rules(){
  const m=modal(`
    <h2>Comment on joue</h2>
    <ol class="steps">
      <li>Un joueur <b>crée la partie</b> et partage le code. Chacun rejoint <b>sur son téléphone</b>.</li>
      <li>À chaque manche, <b>un joueur chante</b>. Il choisit sa chanson, trouve la version karaoké sur YouTube et découvre son <b>défi</b> (s'ils sont activés).</li>
      <li>Pendant qu'il chante, les autres envoient des <b>réactions</b> 👏🔥😂 qui s'affichent sur tous les écrans.</li>
      <li>À la fin, chacun <b>note la performance</b> de 1 à 5 étoiles, en secret.</li>
    </ol>
    <p><b>Points :</b> note moyenne × 20 (5 étoiles = 100 points). Le plus gros total gagne !</p>
    <p class="hint">Astuce : branchez le téléphone du chanteur sur une enceinte ou la télé pour l'ambiance 🎶</p>
    <button class="btn" style="margin-top:10px">Compris</button>`);
  m.querySelector("button").onclick=()=>m.remove();
}

/* ================= Salon ================= */
function lobbyScreen(){
  const s=R.state, set=s.settings, isHost=s.host===myId, n=R.players.length;
  const link=location.origin+location.pathname+"?r="+s.code;
  const seg=(id,opts,cur)=>`<div class="seg" id="${id}">${opts.map(([v,l])=>`<button data-v="${v}" class="${String(cur)===String(v)?"on":""}">${l}</button>`).join("")}</div>`;
  const players=R.players.map((p,i)=>`
    <div class="pl">
      <span class="dot" style="background:${COLORS[i%COLORS.length]}"></span>
      <span class="pname">${esc(p.name)}${p.id===myId?' <span class="hint">(toi)</span>':""}</span>
      ${p.id===s.host?'<span title="Hôte">👑</span>':""}
      ${isHost && p.id!==myId?`<button class="x" data-kick="${esc(p.id)}" aria-label="Retirer ${esc(p.name)}">×</button>`:""}
    </div>`).join("");
  view(`
    <div class="topbar"><span class="pill">Salon karaoké</span><button class="btn ghost small" id="quit">Quitter</button></div>
    <div class="card center">
      <p style="margin:0">Code de la partie</p>
      <div class="code">${s.code}</div>
      <div class="qr" id="qr"></div>
      <p class="hint">Scanne le QR code ou va sur<br><b style="word-break:break-all">${esc(location.host)}/karaoke</b> et tape le code</p>
      <button class="btn sky small" id="share">Envoyer le lien d'invitation</button>
    </div>
    <div class="card"><label class="lbl">Joueurs (${n}/12)</label>${players}</div>
    <div class="card stack">
      ${isHost ? `
        <div><label class="lbl">Chacun chante…</label>${seg("turns",[1,2,3].map(t=>[t,t+" fois"]),set.turns)}</div>
        <div><label class="lbl">Défis rigolos</label>${seg("challenges",[["true","Oui 🤪"],["false","Non"]],set.challenges)}</div>
      ` : `<p style="margin:0"><b>Réglages :</b> chacun chante ${set.turns} fois · défis ${set.challenges?"activés 🤪":"désactivés"}</p>`}
    </div>
    ${isHost
      ? `<button class="btn pop" id="go" ${n<2?"disabled":""}>Lancer le karaoké</button>
         ${n<2?`<p class="hint center">Il faut au moins 2 joueurs.</p>`:""}`
      : `<p class="center hand" style="font-size:20px">En attente que ${who(s.host)} lance la partie…</p>`}
    <button class="btn ghost" id="rules" style="margin-top:10px">Comment on joue ?</button>
    <div style="height:20px"></div>
  `);
  try{ if(window.qrcode){ const q=qrcode(0,"M"); q.addData(link); q.make(); $("#qr").innerHTML=q.createImgTag(5,8,"QR code"); } }catch(e){}
  $("#share").onclick=async()=>{
    if(navigator.share){ try{ await navigator.share({title:"Karaoké Battle",text:"Rejoins mon Karaoké Battle ! Code : "+s.code,url:link}); }catch(e){} return; }
    try{ await navigator.clipboard.writeText(link); toast("Lien copié !"); }catch(e){ toast(link); }
  };
  $("#quit").onclick=quitGame;
  $("#rules").onclick=rules;
  app.querySelectorAll("[data-kick]").forEach(b=>b.onclick=()=>act("kick",{target:b.dataset.kick},b));
  if(isHost){
    [["turns",Number],["challenges",v=>v==="true"]].forEach(([k,cast])=>{
      $("#"+k).querySelectorAll("button").forEach(b=>b.onclick=()=>{
        $("#"+k).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
        act("settings",{settings:{...set,[k]:cast(b.dataset.v)}});
      });
    });
    $("#go").onclick=e=>act("start",{},e.currentTarget);
  }
}

/* ================= Choix de la chanson ================= */
const challengeHTML=s=>s.challenge?`<div class="challenge"><small>🤪 Défi</small>${esc(s.challenge)}</div>`:"";
const roundPill=s=>`<span class="pill">Manche ${s.round+1} / ${s.totalRounds}</span>`;

function pickScreen(){
  const s=R.state;
  view(`
    <div class="topbar">${roundPill(s)}<button class="btn ghost small" id="quit">Quitter</button></div>
    <div class="center"><div class="big-emoji">🎤</div><h2>C'est ton tour de chanter !</h2></div>
    ${challengeHTML(s)}
    <div class="card stack">
      <div>
        <label class="lbl" for="ti">Ta chanson</label>
        <input type="text" id="ti" maxlength="80" placeholder="Titre – Artiste" autocomplete="off">
        <button class="btn ghost small" id="idea" style="margin-top:8px">💡 Une idée au hasard</button>
      </div>
      <a class="btn sky" id="yt" href="#" target="_blank" rel="noopener">🔎 Trouver la version karaoké sur YouTube</a>
      <div>
        <label class="lbl" for="url">Lien de la vidéo <span class="hint">(optionnel, pour la lancer ici)</span></label>
        <input type="url" id="url" placeholder="https://youtu.be/…" autocomplete="off" inputmode="url">
      </div>
    </div>
    <button class="btn pop" id="go">C'est parti, je chante ! 🎶</button>
    <p class="hint center">Astuce : sur YouTube, appuie sur « Partager » puis « Copier le lien », reviens ici et colle-le.</p>
  `);
  const ti=$("#ti"), yt=$("#yt");
  const sync=()=>{ yt.href=ytSearch(ti.value.trim()||"chanson"); };
  ti.addEventListener("input",sync); sync();
  $("#idea").onclick=()=>{ let x; do{ x=SONGS[Math.floor(Math.random()*SONGS.length)]; }while(x===ti.value && SONGS.length>1); ti.value=x; sync(); };
  yt.onclick=e=>{ if(!ti.value.trim()){ e.preventDefault(); ti.focus(); toast("Écris d'abord le titre de ta chanson"); } };
  $("#quit").onclick=quitGame;
  $("#go").onclick=e=>{
    const title=ti.value.trim();
    if(!title){ ti.focus(); toast("Écris le titre de ta chanson"); return; }
    act("choose",{game:s.game,round:s.round,title,yt:$("#url").value.trim()},e.currentTarget);
  };
}

function waitPickScreen(){
  const s=R.state;
  view(`
    <div class="topbar">${roundPill(s)}<button class="btn ghost small" id="quit">Quitter</button></div>
    <div class="spacer"></div>
    <div class="center">
      <div class="big-emoji">🎧</div>
      <h2>${who(s.singer)} choisit sa chanson…</h2>
      <p>Prépare tes réactions !</p>
    </div>
    ${challengeHTML(s)}
    <div class="spacer"></div>
    <button class="btn ghost small" id="skip" style="align-self:center">Passer son tour</button>
  `);
  $("#quit").onclick=quitGame;
  $("#skip").onclick=()=>confirmBox("Passer la manche ?",`À utiliser si ${esc(nameOf(s.singer))} ne peut pas chanter. Pas de points pour cette manche.`,"Passer",()=>act("skip",{game:s.game,round:s.round}));
}

/* ================= Chant ================= */
function singScreen(){
  const s=R.state, song=s.song;
  view(`
    <div class="topbar">${roundPill(s)}<span class="pill">🔴 Tu chantes</span></div>
    <div class="center"><div class="title">${esc(song.title)}</div></div>
    ${challengeHTML(s)}
    ${song.yt
      ? `<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/${song.yt}?playsinline=1&rel=0" title="Vidéo karaoké"
           allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`
      : `<a class="btn sky" href="${esc(ytSearch(song.title))}" target="_blank" rel="noopener">▶️ Lancer la version karaoké sur YouTube</a>
         <p class="hint center">Reviens sur cette page quand tu as fini de chanter.</p>`}
    <div class="card center"><label class="lbl">Réactions du public</label><div class="counts" id="cnt"></div></div>
    <div class="spacer"></div>
    <button class="btn pop" id="done">J'ai fini ! 🎉</button>
  `);
  onUpdate=()=>{ $("#cnt").innerHTML=countsHTML()||'<span class="hint">Pas encore de réaction…</span>'; };
  $("#done").onclick=e=>act("sung",{game:s.game,round:s.round},e.currentTarget);
}

function audienceScreen(){
  const s=R.state;
  view(`
    <div class="topbar">${roundPill(s)}<span class="pill">🔴 En direct</span></div>
    <div class="center">
      <p style="margin:0">${who(s.singer)} chante</p>
      <div class="title">${esc(s.song.title)}</div>
    </div>
    ${challengeHTML(s)}
    <p class="center hand" style="font-size:20px;margin-top:10px">Envoie tes réactions !</p>
    <div class="reacts">${EMOJIS.map(e=>`<button data-e="${e}">${e}</button>`).join("")}</div>
    <div class="counts" id="cnt"></div>
    <div class="spacer"></div>
    <button class="btn ghost small" id="end" style="align-self:center;margin-top:12px">La chanson est finie → voter</button>
  `);
  app.querySelectorAll("[data-e]").forEach(b=>b.addEventListener("click",()=>sendReaction(b.dataset.e)));
  onUpdate=()=>{ $("#cnt").innerHTML=countsHTML(); };
  $("#end").onclick=()=>confirmBox("Passer au vote ?",`${esc(nameOf(s.singer))} a fini de chanter ?`,"Oui, on vote",()=>act("sung",{game:s.game,round:s.round}));
}

/* ================= Vote ================= */
function voteTimer(s){
  every(250,()=>{ const b=$("#vb"); if(b) b.style.width=Math.max(0,Math.min(100,(s.voteEnd-sNow())/400))+"%"; });
}
function voteProgress(){
  const s=R.state;
  return votersOf(s).map(id=>`<div class="pl"><span class="dot" style="background:${colorOf(id)}"></span><span class="pname">${esc(nameOf(id))}</span><span>${R.voted.includes(id)?"✅":"⏳"}</span></div>`).join("");
}

function voteScreen(){
  const s=R.state;
  let stars=0;
  view(`
    <div class="topbar">${roundPill(s)}<span class="pill">🗳️ Vote secret</span></div>
    <div class="bar"><div id="vb" style="width:100%"></div></div>
    <div class="center">
      <p style="margin:0">Note la performance de</p>
      <h2>${who(s.singer)}</h2>
      <p class="hint">« ${esc(s.song?s.song.title:"")} »</p>
    </div>
    <div class="stars" id="st">${[1,2,3,4,5].map(n=>`<button data-n="${n}" aria-label="${n} étoile${n>1?"s":""}">★</button>`).join("")}</div>
    <p class="center hand" id="lbl" style="font-size:22px;min-height:30px"></p>
    <div class="reacts" style="grid-template-columns:repeat(6,1fr);gap:6px">${EMOJIS.map(e=>`<button data-e="${e}" style="font-size:26px;padding:6px 0">${e}</button>`).join("")}</div>
    <div class="spacer"></div>
    <button class="btn pop" id="ok" disabled>Valider ma note</button>
  `);
  const LBL=["","Aïe aïe aïe 😬","Peut mieux faire 😅","Pas mal ! 🙂","Super ! 🤩","Légendaire !!! 🌟"];
  app.querySelectorAll("#st button").forEach(b=>b.onclick=()=>{
    stars=+b.dataset.n;
    app.querySelectorAll("#st button").forEach(x=>x.classList.toggle("on",+x.dataset.n<=stars));
    $("#lbl").textContent=LBL[stars]; $("#ok").disabled=false;
  });
  app.querySelectorAll("[data-e]").forEach(b=>b.addEventListener("click",()=>sendReaction(b.dataset.e)));
  $("#ok").onclick=e=>{ if(stars) act("vote",{game:s.game,round:s.round,stars},e.currentTarget); };
  voteTimer(s);
}

function votedScreen(){
  const s=R.state;
  view(`
    <div class="topbar">${roundPill(s)}<span class="pill">🗳️ Vote secret</span></div>
    <div class="bar"><div id="vb" style="width:100%"></div></div>
    <div class="center"><div class="big-emoji">✅</div><h2>Note envoyée !</h2><p>On attend les autres…</p></div>
    <div class="card"><div id="prog"></div></div>
  `);
  voteTimer(s);
  onUpdate=()=>{ $("#prog").innerHTML=voteProgress(); };
}

function singerWaitVoteScreen(){
  const s=R.state;
  view(`
    <div class="topbar">${roundPill(s)}<span class="pill">🗳️ Vote secret</span></div>
    <div class="bar"><div id="vb" style="width:100%"></div></div>
    <div class="center"><div class="big-emoji">😬</div><h2>Bravo !<br>Le public te note…</h2></div>
    <div class="card"><div id="prog"></div></div>
    <div class="counts" id="cnt"></div>
  `);
  voteTimer(s);
  onUpdate=()=>{ $("#prog").innerHTML=voteProgress(); $("#cnt").innerHTML=countsHTML(); };
}

/* ================= Résultats ================= */
const starsTxt=avg=>{ const f=Math.round(avg); return "★".repeat(f)+"☆".repeat(5-f); };
function scoreList(){
  const s=R.state;
  return s.order.slice().sort((a,b)=>(s.scores[b]||0)-(s.scores[a]||0))
    .map(id=>`<div class="score"><span><span class="dot" style="display:inline-block;vertical-align:middle;background:${colorOf(id)};margin-right:8px"></span>${esc(nameOf(id))}${id===myId?' <span class="hint">(toi)</span>':""}</span><b>${s.scores[id]||0}</b></div>`).join("");
}

function resultScreen(){
  const s=R.state, r=s.result, last=s.round+1>=s.totalRounds;
  const max=Math.max(1,...r.dist);
  view(`
    <div class="topbar">${roundPill(s)}<button class="btn ghost small" id="quit">Quitter</button></div>
    <div class="center pop-in">
      ${r.skipped ? `
        <div class="big-emoji">🙊</div><h2>${who(s.singer)} a passé son tour</h2><p>Pas de points pour cette manche.</p>
      ` : r.count ? `
        <p style="margin:0">${who(s.singer)} · « ${esc(s.song?s.song.title:"")} »</p>
        <div class="avg">${r.avg.toFixed(1).replace(".",",")}<span style="font-size:28px">/5</span></div>
        <div style="font-size:30px;color:var(--sun);text-shadow:2px 2px 0 var(--ink)">${starsTxt(r.avg)}</div>
        <h2 style="margin-top:8px">+${r.pts} points ${r.avg>=4.5?"🌟":r.avg>=3.5?"🎉":r.avg>=2.5?"👍":"😅"}</h2>
      ` : `<div class="big-emoji">🤷</div><h2>Personne n'a voté !</h2>`}
    </div>
    ${!r.skipped && r.count ? `<div class="card"><label class="lbl">${r.count} vote${r.count>1?"s":""}${r.reactions?` · ${r.reactions} réaction${r.reactions>1?"s":""}`:""}</label>
      <div class="dist">${[5,4,3,2,1].map(n=>`<div><span style="width:60px">${n} ★</span><i style="width:${r.dist[n-1]/max*70}%"></i><span>${r.dist[n-1]}</span></div>`).join("")}</div></div>`:""}
    <div class="card">${scoreList()}</div>
    <button class="btn pop" id="next">${last?"Voir le classement final 🏆":"Manche suivante →"}</button>
    <p class="hint center">N'importe quel joueur peut passer à la suite.</p>
    <div style="height:20px"></div>
  `);
  $("#quit").onclick=quitGame;
  $("#next").onclick=e=>act("next",{game:s.game,round:s.round},e.currentTarget);
}

function finalScreen(){
  const s=R.state;
  const order=s.order.slice().sort((a,b)=>(s.scores[b]||0)-(s.scores[a]||0));
  const top=s.scores[order[0]]||0, winners=order.filter(id=>(s.scores[id]||0)===top);
  const medals=["🥇","🥈","🥉"];
  const best=s.history.filter(h=>!h.skipped && h.avg).sort((a,b)=>b.avg-a.avg)[0];
  view(`
    <div class="center pop-in">
      <div class="big-emoji">🏆</div>
      <h1 style="font-size:32px">${winners.length>1?"Égalité !":"La star de la soirée"}</h1>
      <div class="title">${winners.map(id=>esc(nameOf(id))).join(" & ")}</div>
      <p>avec ${top} point${top>1?"s":""}</p>
    </div>
    <div class="card">
      ${order.map((id,r)=>`<div class="score"><span>${medals[r]||"·"} <span style="color:${colorOf(id)};font-weight:600">${esc(nameOf(id))}</span></span><b>${s.scores[id]||0}</b></div>`).join("")}
    </div>
    ${best?`<div class="card center"><label class="lbl">🌟 Meilleure performance</label><p style="margin:0">${who(best.singer)} · « ${esc(best.title)} » · ${best.avg.toFixed(1).replace(".",",")}/5</p></div>`:""}
    <div class="card"><label class="lbl">Les chansons de la soirée</label>
      ${s.history.map(h=>`<p style="margin:4px 0">${who(h.singer)} — ${h.skipped?"<i>tour passé</i>":`« ${esc(h.title||"")} » · ${h.avg.toFixed(1).replace(".",",")}/5`}</p>`).join("")}
    </div>
    <button class="btn pop" id="again">Rejouer (retour au salon)</button>
    <button class="btn ghost" id="quit" style="margin-top:10px">Quitter</button>
    <div style="height:20px"></div>
  `);
  $("#again").onclick=e=>act("lobby",{game:s.game},e.currentTarget);
  $("#quit").onclick=quitGame;
}

/* ================= Démarrage ================= */
(async function boot(){
  const inv=(new URLSearchParams(location.search).get("r")||"").toUpperCase();
  const saved=LS.get("ka-room");
  const c=/^[A-Z]{4}$/.test(inv) ? inv : saved;
  if(c && /^[A-Z]{4}$/.test(c)){
    try{
      const r=await fetch(`${API}?code=${c}&id=${encodeURIComponent(myId)}`,{cache:"no-store"});
      const j=await r.json().catch(()=>null);
      if(r.ok && j && j.players.some(p=>p.id===myId)){ code=c; enterRoom(j); return; }
      if(r.status===404 && inv){ history.replaceState(null,"",location.pathname); home(); toast("Cette partie n'existe plus."); LS.del("ka-room"); return; }
      if(r.status>=500 && j && j.error){ home(); toast(j.error); return; }
    }catch(e){}
  }
  if(saved && saved!==inv) LS.del("ka-room");
  home();
})();
</script>
