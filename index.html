<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#150d2b">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nous Deux">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Nous Deux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,500;1,600&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#150d2b; --night2:#2a1342; --plum:#4b1d4f;
    --text:#f8eef4; --muted:#c3aec6; --faint:#8d7898;
    --rose:#ff7aa2; --rose2:#ff9fbd; --peach:#ffbe98; --gold:#f5d08a; --mint:#7fe0c4;
    --glass:rgba(255,255,255,.07); --glass2:rgba(255,255,255,.12); --stroke:rgba(255,255,255,.14);
    --serif:'Cormorant Garamond',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --hand:'Caveat',cursive;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100%;color:var(--text);font-family:var(--sans);font-size:16px;background:var(--night)}
  body{background:
      radial-gradient(1200px 600px at 85% -10%,rgba(255,122,162,.22),transparent 60%),
      radial-gradient(900px 500px at -10% 30%,rgba(130,90,255,.18),transparent 60%),
      linear-gradient(170deg,var(--night) 0%,var(--night2) 55%,var(--plum) 100%) fixed;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;z-index:0;
    background-image:radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 72% 9%,#fff,transparent),
      radial-gradient(1.5px 1.5px at 38% 42%,#ffd9e6,transparent),radial-gradient(1px 1px at 88% 36%,#fff,transparent),
      radial-gradient(1px 1px at 22% 72%,#fff,transparent),radial-gradient(1.5px 1.5px at 64% 66%,#fff,transparent),
      radial-gradient(1px 1px at 92% 82%,#ffd9e6,transparent),radial-gradient(1px 1px at 6% 92%,#fff,transparent),
      radial-gradient(1px 1px at 50% 12%,#fff,transparent),radial-gradient(1px 1px at 30% 90%,#fff,transparent);
    animation:twinkle 6s ease-in-out infinite alternate}
  @keyframes twinkle{to{opacity:.25}}
  button,input,textarea{font-family:inherit;color:inherit;font-size:inherit}
  #app{position:relative;z-index:1;max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column}
  .page{flex:1;padding:8px 18px calc(110px + env(safe-area-inset-bottom))}
  .solo{flex:1;display:flex;flex-direction:column;justify-content:center;padding:28px 20px}
  h1,h2,h3{font-family:var(--serif);font-weight:700;margin:0;line-height:1.05}
  h1{font-size:46px} h2{font-size:30px} h3{font-size:22px}
  p{margin:6px 0;color:var(--muted);line-height:1.5}
  em{font-family:var(--serif);font-style:italic;color:var(--rose2)}
  .center{text-align:center}
  .muted{color:var(--muted)} .faint{color:var(--faint);font-size:13px}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--rose2);margin:0 0 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}

  /* en-tête et navigation */
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;
       padding:calc(12px + env(safe-area-inset-top)) 18px 10px;background:linear-gradient(var(--night) 60%,transparent)}
  .brand{font-family:var(--serif);font-size:26px;font-weight:700;font-style:italic;letter-spacing:.3px}
  .brand b{color:var(--rose);font-style:normal;display:inline-block;animation:beat 2s infinite;margin:0 2px}
  @keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.25)}24%{transform:scale(1)}36%{transform:scale(1.12)}}
  .round{width:42px;height:42px;border-radius:50%;border:1px solid var(--stroke);background:var(--glass);display:grid;place-items:center;cursor:pointer;color:var(--text)}
  .round svg{width:20px;height:20px}
  .tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:6;width:calc(100% - 24px);max-width:520px;
        display:flex;padding:6px;border-radius:24px;background:rgba(30,16,52,.78);border:1px solid var(--stroke);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
        box-shadow:0 10px 40px rgba(0,0,0,.45)}
  .tabs button{flex:1;border:0;background:none;color:var(--faint);padding:8px 0 6px;border-radius:18px;cursor:pointer;font-size:11px;font-weight:700;position:relative;
               display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .2s,color .2s}
  .tabs svg{width:22px;height:22px}
  .tabs button.on{color:#fff;background:linear-gradient(135deg,rgba(255,122,162,.35),rgba(255,190,152,.18))}
  .badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--rose);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;line-height:17px;padding:0 4px}

  /* cartes */
  .card{background:var(--glass);border:1px solid var(--stroke);border-radius:24px;padding:18px;margin:14px 0;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .card.glow{background:linear-gradient(140deg,rgba(255,122,162,.22),rgba(255,190,152,.1));border-color:rgba(255,159,189,.35)}
  .btn{appearance:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:16px;padding:14px 18px;cursor:pointer;
       font-weight:700;color:#2a0f24;background:linear-gradient(135deg,var(--rose),var(--peach));box-shadow:0 8px 24px rgba(255,122,162,.28);transition:transform .08s,opacity .2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.5}
  .btn.ghost{background:var(--glass2);color:var(--text);box-shadow:none;border:1px solid var(--stroke)}
  .btn.small{width:auto;display:inline-flex;padding:9px 14px;font-size:14px;border-radius:12px}
  .link{background:none;border:0;color:var(--rose2);font-weight:700;cursor:pointer;padding:0;font-size:14px}
  .x{border:0;background:none;color:var(--faint);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
  input[type=text],input[type=password],input[type=number],input[type=date],textarea{width:100%;min-width:0;padding:13px 14px;border-radius:14px;
       border:1px solid var(--stroke);background:rgba(0,0,0,.22);color:var(--text);font-size:16px;color-scheme:dark}
  input::placeholder,textarea::placeholder{color:var(--faint)}
  input:focus,textarea:focus{outline:2px solid rgba(255,122,162,.55);outline-offset:1px}
  textarea{resize:vertical;min-height:96px;line-height:1.45}
  .row{display:flex;gap:10px;align-items:center}
  .row > .grow{flex:1}
  .stack{display:flex;flex-direction:column;gap:12px}
  .seg{display:flex;padding:4px;border-radius:14px;background:rgba(0,0,0,.25);border:1px solid var(--stroke)}
  .seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;cursor:pointer;font-weight:700;font-size:14px;color:var(--muted)}
  .seg button.on{background:var(--glass2);color:#fff}

  /* accueil */
  .hero{text-align:center;padding:18px 0 6px}
  .hero .names{font-family:var(--serif);font-size:44px;font-weight:700;line-height:1}
  .hero .names i{color:var(--rose);font-weight:600}
  .hero .num{font-family:var(--serif);font-size:88px;font-weight:700;line-height:.9;margin-top:14px;
             background:linear-gradient(135deg,#fff,var(--rose2) 60%,var(--peach));-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .unit{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--rose2)}
  .hero .ymd{color:var(--muted);margin-top:6px}
  .pillnote{display:inline-flex;gap:8px;align-items:center;margin-top:12px;padding:7px 14px;border-radius:999px;background:var(--glass);border:1px solid var(--stroke);font-size:14px;color:var(--text)}
  .reunion{display:flex;align-items:center;gap:16px}
  .reunion .j{font-family:var(--serif);font-size:56px;font-weight:700;line-height:1;color:var(--gold);min-width:84px;text-align:center}
  .reunion .j small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:1.4px;color:var(--muted);font-weight:700}
  .moodbig{display:flex;gap:14px;align-items:center}
  .moodbig .e{font-size:54px;line-height:1;filter:drop-shadow(0 6px 16px rgba(255,122,162,.35))}
  .moodbig .l{font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.1}
  .moodbig .tx{color:var(--text);margin-top:4px}
  .moodmine{display:flex;align-items:center;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--stroke)}
  .moodmine .e{font-size:28px}
  .lastnote{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.25;margin:2px 0 6px;word-break:break-word}
  .date{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--stroke)}
  .date:last-child{border-bottom:0}
  .date .d{flex:1}
  .date .when{font-weight:700;font-size:13px;color:var(--gold);text-align:right;white-space:nowrap}
  .banner{display:flex;gap:12px;align-items:center}
  .banner .ic{font-size:30px}

  /* petits mots */
  .bubble{max-width:86%;padding:12px 16px;margin:12px 0;border-radius:22px;position:relative}
  .bubble.me{margin-left:auto;background:linear-gradient(135deg,rgba(255,122,162,.38),rgba(255,190,152,.22));border-bottom-right-radius:6px}
  .bubble.them{background:var(--glass2);border:1px solid var(--stroke);border-bottom-left-radius:6px}
  .bubble .txt{font-size:17px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
  .bubble .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin-top:6px}
  .hb{border:0;background:none;font-size:18px;cursor:pointer;padding:0;filter:grayscale(1);opacity:.45}
  .hb.on{filter:none;opacity:1}
  .hs{position:absolute;bottom:-10px;left:-8px;font-size:20px}
  .new{display:inline-block;background:var(--rose);color:#fff;border-radius:999px;font-size:10px;padding:1px 7px;font-weight:700}
  .daysep{text-align:center;font-size:12px;color:var(--faint);margin:18px 0 4px;letter-spacing:.5px}

  /* souvenirs */
  .polas{display:grid;grid-template-columns:1fr 1fr;gap:16px 14px;margin-top:12px}
  .pola{background:#fbf6ef;color:#3a2433;padding:8px 8px 10px;border-radius:6px;box-shadow:0 10px 26px rgba(0,0,0,.4);cursor:pointer;transition:transform .2s;border:0;text-align:left}
  .pola:nth-child(odd){transform:rotate(-1.8deg)} .pola:nth-child(even){transform:rotate(1.6deg)}
  .pola:active{transform:scale(.97)}
  .pola img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#e9dfd3;border-radius:2px}
  .pola .cap{font-family:var(--hand);font-size:21px;line-height:1.05;margin-top:6px;min-height:22px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .pola .dt{font-size:11px;color:#8a7380;margin-top:2px;display:flex;justify-content:space-between}
  .addpola{border:2px dashed rgba(255,159,189,.5);background:rgba(255,122,162,.08);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;
           gap:6px;min-height:200px;color:var(--rose2);font-weight:700;cursor:pointer}
  .addpola span{font-size:38px}
  .memview img.full{width:100%;border-radius:10px;display:block;background:#000}
  .memview .polabig{background:#fbf6ef;color:#3a2433;padding:10px 10px 14px;border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
  .memview .cap{font-family:var(--hand);font-size:28px;line-height:1.1;margin-top:10px;white-space:pre-wrap;word-break:break-word}
  .mnote{background:var(--glass2);border:1px solid var(--stroke);border-radius:16px;padding:10px 12px;margin:8px 0}
  .mnote .w{font-size:12px;font-weight:700;color:var(--rose2);display:flex;justify-content:space-between}
  .mnote .t{white-space:pre-wrap;word-break:break-word;margin-top:2px}
  .drop{border:2px dashed rgba(255,159,189,.5);border-radius:18px;padding:22px;text-align:center;cursor:pointer;color:var(--rose2);font-weight:700;background:rgba(255,122,162,.06)}
  .drop img{max-width:100%;max-height:45vh;border-radius:10px;display:block;margin:0 auto}


  /* question */
  .question{font-family:var(--serif);font-size:34px;font-weight:700;font-style:italic;line-height:1.15;text-align:center;margin:6px 0 2px}
  .answer{background:var(--glass2);border:1px solid var(--stroke);border-radius:18px;padding:12px 14px;margin:10px 0}
  .answer.them{background:linear-gradient(135deg,rgba(255,122,162,.25),rgba(255,190,152,.12))}
  .answer .n{font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--rose2)}
  .answer .a{font-size:17px;line-height:1.45;white-space:pre-wrap;word-break:break-word;margin-top:4px}
  .locked{filter:blur(6px);user-select:none}
  details summary{cursor:pointer;font-weight:700;color:var(--rose2);list-style:none}
  details summary::-webkit-details-marker{display:none}

  /* humeurs */
  .moods{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .moods button{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 12px;border-radius:14px;border:1px solid var(--stroke);background:var(--glass);cursor:pointer;font-weight:500;font-size:14px;color:var(--text)}
  .moods button span{font-size:24px;line-height:1}
  .moods button.on{background:linear-gradient(135deg,rgba(255,122,162,.4),rgba(255,190,152,.2));border-color:rgba(255,159,189,.6)}
  .moods button.spicy{border-color:rgba(255,90,90,.45)}

  /* je pense à toi */
  .thinkcard{text-align:center;padding:22px 18px}
  .thinkbtn{width:118px;height:118px;border-radius:50%;border:0;cursor:pointer;font-size:58px;line-height:1;margin:0 auto 10px;display:grid;place-items:center;
            background:radial-gradient(circle at 35% 30%,#ffb3c9,var(--rose) 60%,#d94a7a);box-shadow:0 0 0 10px rgba(255,122,162,.12),0 0 0 22px rgba(255,122,162,.06),0 14px 40px rgba(255,122,162,.45);
            animation:pulse 2.4s ease-in-out infinite;transition:transform .1s;user-select:none;-webkit-user-select:none}
  .thinkbtn:active{transform:scale(.9)}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 10px rgba(255,122,162,.12),0 0 0 22px rgba(255,122,162,.06),0 14px 40px rgba(255,122,162,.45)}50%{box-shadow:0 0 0 16px rgba(255,122,162,.16),0 0 0 32px rgba(255,122,162,.05),0 14px 50px rgba(255,122,162,.6)}}
  .stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px}
  /* distance et météo */
  .geo{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center}
  .geo .big{font-family:var(--serif);font-size:36px;font-weight:700;line-height:1;color:var(--gold)}
  .geo .box{background:rgba(0,0,0,.18);border-radius:18px;padding:14px 8px}
  /* lettres */
  .envs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  .env{position:relative;border:0;cursor:pointer;text-align:center;padding:26px 10px 16px;border-radius:14px;color:#3a2433;
       background:linear-gradient(160deg,#fbf3ea,#f1e2d3);box-shadow:0 10px 26px rgba(0,0,0,.35);overflow:hidden;min-height:150px}
  .env::before{content:"";position:absolute;left:0;right:0;top:0;height:58px;background:linear-gradient(160deg,#f4e6d8,#e8d4c1);clip-path:polygon(0 0,100% 0,50% 100%)}
  .env .seal{position:relative;z-index:1;width:42px;height:42px;margin:6px auto 10px;border-radius:50%;display:grid;place-items:center;font-size:20px;
             background:radial-gradient(circle at 35% 30%,#ff8fae,#c2335f);box-shadow:0 3px 8px rgba(0,0,0,.3);color:#fff}
  .env .lb{font-family:var(--hand);font-size:22px;line-height:1.05;position:relative;z-index:1}
  .env .sm{font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#a07e8e;position:relative;z-index:1}
  .env.locked{filter:saturate(.6) brightness(.92)}
  .env.opened{min-height:0;padding:14px 10px}
  .env.opened::before{display:none}
  .paper{background:#fbf6ef;color:#3a2433;border-radius:10px;padding:22px 20px;box-shadow:0 14px 40px rgba(0,0,0,.45);
         background-image:repeating-linear-gradient(transparent 0 33px,rgba(160,120,140,.18) 33px 34px);}
  .paper .hd{font-size:12px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#a07e8e;margin-bottom:8px}
  .paper .body{font-family:var(--hand);font-size:26px;line-height:34px;white-space:pre-wrap;word-break:break-word}
  .paper .sig{font-family:var(--hand);font-size:26px;text-align:right;margin-top:10px;color:#c2335f}
  .unfold{animation:unfold .6s cubic-bezier(.2,.9,.3,1.1)}
  @keyframes unfold{from{transform:perspective(800px) rotateX(70deg) scale(.8);opacity:0}}
  .chipsel{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
  .chipsel button{border:1px solid var(--stroke);background:var(--glass);border-radius:999px;padding:7px 12px;cursor:pointer;font-size:14px;color:var(--text)}
  .chipsel button.on{background:linear-gradient(135deg,rgba(255,122,162,.45),rgba(255,190,152,.25));border-color:rgba(255,159,189,.6)}
  .writepaper{background:#fbf6ef;color:#3a2433;font-family:var(--hand);font-size:24px;line-height:32px;min-height:220px;border:0;
              background-image:repeating-linear-gradient(transparent 0 31px,rgba(160,120,140,.2) 31px 32px);padding:10px 14px}
  .writepaper::placeholder{color:#b49aa8}
  /* bocal */
  .jar{position:relative;width:150px;height:170px;margin:4px auto 12px}
  .jar .glass{position:absolute;inset:22px 6px 0;border-radius:28px 28px 34px 34px;background:linear-gradient(90deg,rgba(255,255,255,.16),rgba(255,255,255,.05) 40%,rgba(255,255,255,.12));
              border:2px solid rgba(255,255,255,.35);overflow:hidden}
  .jar .lid{position:absolute;left:24px;right:24px;top:6px;height:22px;border-radius:8px;background:linear-gradient(#f5d08a,#c99a4b);box-shadow:0 2px 6px rgba(0,0,0,.3)}
  .jar .papers{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap-reverse;justify-content:center;gap:2px;padding:8px}
  .jar .papers span{font-size:18px;line-height:1}
  .jar .count{position:absolute;inset:auto 0 -6px;text-align:center}
  .reason{background:#fbf6ef;color:#3a2433;border-radius:10px;padding:10px 14px;margin:8px 0;font-family:var(--hand);font-size:22px;line-height:1.15;box-shadow:0 6px 16px rgba(0,0,0,.3)}
  .reason small{display:block;font-family:var(--sans);font-size:11px;color:#a07e8e;margin-top:4px}
  /* dessin */
  .doodlewrap{position:relative;width:100%;aspect-ratio:1;background:#fff;border-radius:16px;overflow:hidden;touch-action:none}
  .doodlewrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
  .sw{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.4);cursor:pointer;flex:none}
  .sw.on{outline:3px solid #fff;outline-offset:2px}
  .bubble img.doodle{display:block;width:100%;max-width:260px;border-radius:12px;background:#fff;margin-bottom:4px}

  /* snaps */
  .snapstrip{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 2px;scrollbar-width:none}
  .snapstrip::-webkit-scrollbar{display:none}
  .snapit{flex:none;width:70px;border:0;background:none;cursor:pointer;color:var(--text);padding:0;text-align:center}
  .snapit .ring{width:66px;height:66px;border-radius:50%;padding:3px;margin:0 auto;background:rgba(255,255,255,.18)}
  .snapit.new .ring{background:conic-gradient(from 210deg,var(--rose),var(--peach),var(--gold),var(--rose))}
  .snapit .ring img,.snapit .ring div{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--night);display:grid;place-items:center;background:var(--glass2);font-size:26px}
  .snapit small{display:block;font-size:11px;margin-top:5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .snapit.new small{color:#fff;font-weight:700}
  .snapfull{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;animation:fade .2s}
  .snapfull .stage{position:relative;flex:1;overflow:hidden;display:grid;place-items:center}
  .snapfull .stage img{max-width:100%;max-height:100%;object-fit:contain;display:block}

<script>
/* ================= Outils ================= */

const daysBetween=(a,b)=>Math.round((b-a)/86400000);
const plural=(n,w,p)=>n+" "+(n>1?(p||w+"s"):w);
const MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const DAYS=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];

const MY_TZ=(()=>{ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone||""; }catch(e){ return ""; } })();
function ago(t){
  const s=(Date.now()-t)/1000;
  if(s<60) return "à l'instant";
  if(s<3600) return "il y a "+Math.floor(s/60)+" min";
  if(s<86400) return "il y a "+Math.floor(s/3600)+" h";
  if(s<172800) return "hier";
  const d=new Date(t); return "le "+d.getDate()+"/"+pad(d.getMonth()+1);
}
const hhmm=t=>{ const d=new Date(t); return pad(d.getHours())+":"+pad(d.getMinutes()); };
function toast(msg){
  let t=$("#toast"); if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=msg; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),3200);
}
function hearts(n=8,x,y){

function sheet(html){
  const m=document.createElement("div"); m.className="modal";

const ICONS={

/* ================= État ================= */
let CODE=LS.get("nd-code"), WHO=LS.get("nd-who"), D=null, PEOPLE={dali:"Dali",rahma:"Rahma"}, VAPID=null;
let tab=LS.get("nd-tab")||"home", pendingRender=false, openMem=null, CLOCK=0, memSub=LS.get("nd-memsub")||"photos";
const sNow=()=>Date.now()+CLOCK;
if(!["home","notes","memories","letters","question"].includes(tab)) tab="home";
const other=()=>WHO==="dali"?"rahma":"dali";
const nm=p=>PEOPLE[p]||p;

async function api(method, body){
  const opts={method, headers:{"X-Code":CODE||""}, cache:"no-store"};
  let url=API;
  const base={who:WHO||"", day:ymd(new Date()), tz:MY_TZ};
  if(method==="GET") url+="?"+new URLSearchParams(base);
  else{ opts.headers["Content-Type"]="application/json"; opts.body=JSON.stringify({...base,...body}); }
  const r=await fetch(url,opts);
  let j=null; try{ j=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error((j&&j.error)||(r.status===413?"Photo trop lourde":"Erreur ("+r.status+")")); err.status=r.status; throw err; }
  if(j && j.now) CLOCK=j.now-Date.now();
  return j;
}
async function refresh(force){
  if(!CODE || !WHO) return;
  try{ D=await api("GET"); render(force); }
  catch(e){ if(e.status===401) logout("Code secret changé ou incorrect."); }
}
async function act(action, data, btn){
  const label=btn&&btn.innerHTML;
  if(btn){ btn.disabled=true; }
  try{ D=await api("POST",{action,...data}); render(true); return D; }
  catch(e){ toast(e.message); return null; }
  finally{ if(btn && btn.isConnected){ btn.disabled=false; btn.innerHTML=label; } }
}
setInterval(()=>{ if(!document.hidden && D) refresh(); }, 15000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && D){ refresh(); autoLocation(); } });

const typing=()=>{ const a=document.activeElement; return a && /INPUT|TEXTAREA/.test(a.tagName) && a.value; };
function logout(msg){ CODE=null; D=null; LS.del("nd-code"); loginScreen(); if(msg) toast(msg); }

/* ================= Notifications push ================= */
const PUSH_OK="serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
const IS_IOS=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const STANDALONE=matchMedia("(display-mode: standalone)").matches || navigator.standalone===true;
let swReg=null, PUSH="unknown"; // on | off | denied | unsupported | needs-install
async function initSW(){
  if(!("serviceWorker" in navigator)) return;
  try{ swReg=await navigator.serviceWorker.register("/sw.js"); }catch(e){}

    if(!e.data) return;
    if(e.data.type==="refresh") refresh();
    if(e.data.type==="open"){ const u=new URL(e.data.url); if(u.searchParams.get("call")) callApi().then(c=>checkIncomingCall(c,true)).catch(()=>{}); else openDeepLink(u); }
  });
}
async function checkPush(){
  if(IS_IOS && !STANDALONE) PUSH="needs-install";
  else if(!PUSH_OK || !swReg) PUSH="unsupported";
  else if(Notification.permission==="denied") PUSH="denied";
  else{ const s=await swReg.pushManager.getSubscription(); PUSH=(s && Notification.permission==="granted")?"on":"off"; }
  return PUSH;
}
function b64u(s){ const p="=".repeat((4-s.length%4)%4); const b=atob((s+p).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(b,c=>c.charCodeAt(0)); }
async function enablePush(btn){
  if(PUSH==="needs-install") return installHelp(true);
  if(PUSH==="unsupported") return toast("Ce navigateur ne gère pas les notifications");
  if(!VAPID) return toast("Notifications pas encore disponibles sur le serveur");
  let perm;
  try{ perm=await Notification.requestPermission(); }catch(e){ perm="default"; }
  if(perm!=="granted"){ await checkPush(); render(true); return toast(perm==="denied"?"Notifications bloquées : autorise-les dans les réglages du téléphone":"Notifications non activées"); }
  if(btn) btn.disabled=true;
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64u(VAPID)});

}

function together(){
  const s=parseDay(D.start), t=todayDate();
  let y=t.getFullYear()-s.getFullYear(), m=t.getMonth()-s.getMonth(), d=t.getDate()-s.getDate();
  if(d<0){ m--; d+=new Date(t.getFullYear(),t.getMonth(),0).getDate(); }
  if(m<0){ y--; m+=12; }
  return {y,m,d,days:daysBetween(s,t)};
}
function nextOccurrence(dateStr, yearly){
  const t=todayDate(), d=parseDay(dateStr);
  if(!yearly) return d;
  let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());
  if(n<t) n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());
  return n;
}
function whenTxt(n){
  const k=daysBetween(todayDate(),n);
  if(k===0) return `<span style="color:var(--rose2)">Aujourd'hui ✨</span>`;
  if(k===1) return "Demain";
  if(k>1) return "dans "+plural(k,"jour");
  return "il y a "+plural(-k,"jour");
}
const monthsLabel=n=>n%12===0?plural(n/12,"an"):(n>=12?plural(Math.floor(n/12),"an")+" et "+(n%12)+" mois":n+" mois");
const photoUrl=(m,size)=>`${API}?photo=${m.id}&k=${m.tk}&s=${size||"thumb"}`;

function loadImage(file){
  return new Promise((res,rej)=>{ const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>res({img,url}); img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error("Format de photo non pris en charge")); }; img.src=url; });
}
function toJpeg(img,max,q){
  const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
  const w=Math.round(img.naturalWidth*s), h=Math.round(img.naturalHeight*s);
  const c=document.createElement("canvas"); c.width=w; c.height=h;
  const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,w,h); x.drawImage(img,0,0,w,h);
  return {data:c.toDataURL("image/jpeg",q),w,h};
}
async function preparePhoto(file){
  const {img,url}=await loadImage(file);
  let full;
  for(const [m,q] of [[1600,.82],[1400,.76],[1200,.72],[1000,.68],[800,.62]]){ full=toJpeg(img,m,q); if(full.data.length<700000) break; }
  const thumb=toJpeg(img,520,.74);
  URL.revokeObjectURL(url);
  return {full,thumb};
}

/* ================= Distance et météo ================= */
function km(a,b){
  const R=6371, r=x=>x*Math.PI/180, dLat=r(b.lat-a.lat), dLon=r(b.lon-a.lon);
  const h=Math.sin(dLat/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLon/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(h)));
}

function loadLeaflet(){

  if(leafletP) return leafletP;

function drawMap(container,obj,layers,fit,label){
  layers.clearLayers();
  const pts=[];
  for(const p of [WHO,other()]){
    const l=D.locs[p]; if(!l) continue;
    const ll=[l.lat,l.lon]; pts.push(ll);
    if(l.precise!==false && l.acc>30) L.circle(ll,{radius:l.acc,color:p===WHO?"#f5d08a":"#ff7aa2",weight:1,fillOpacity:.08}).addTo(layers);
    L.marker(ll,{icon:facePin(p),zIndexOffset:p===WHO?0:100}).addTo(layers);
  }
  if(pts.length===2){
    L.polyline(pts,{color:"#ff9fbd",weight:2,dashArray:"6 8",opacity:.9}).addTo(layers);
    const mid=[(pts[0][0]+pts[1][0])/2,(pts[0][1]+pts[1][1])/2];
    const d=km(D.locs[WHO],D.locs[other()]);
    if(label && d>=1) L.marker(mid,{interactive:false,icon:L.divIcon({className:"",iconSize:[0,0],html:`<span class="distlabel">💗 ${d.toLocaleString("fr-FR")} km</span>`})}).addTo(layers);
  }
  if(fit){
    if(pts.length===2 && km(D.locs[WHO],D.locs[other()])>=1) obj.fitBounds(pts,{paddingTopLeft:[80,110],paddingBottomRight:[80,50],maxZoom:13});
    else if(pts.length) obj.setView(pts[pts.length-1],14);
  }
}
async function mountMap(){

    mapObj=L.map(div,{zoomControl:false,attributionControl:true,worldCopyJump:true,zoomSnap:.25});

async function openFullMap(){
  const box=document.createElement("div"); box.className="mapfull";

function shareLocation(btn,opts={}){
  return new Promise(resolve=>{
    if(!navigator.geolocation){ if(!opts.silent) toast("Localisation non disponible"); return resolve(false); }
    const precise=opts.precise!=null?opts.precise:getPrecise();
    LS.set("nd-precise",precise?"1":"0");
    if(btn) btn.disabled=true;
    navigator.geolocation.getCurrentPosition(async pos=>{
      const lat=pos.coords.latitude, lon=pos.coords.longitude;
      let city="";
      try{ const r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=fr`); const j=await r.json(); city=j.city||j.locality||""; }catch(e){}
      const ok=opts.silent ? await api("POST",{action:"loc.set",lat,lon,city,precise,acc:pos.coords.accuracy}).then(j=>{ D=j; render(); return true; }).catch(()=>false)
                           : await act("loc.set",{lat,lon,city,precise,acc:pos.coords.accuracy});
      if(btn&&btn.isConnected) btn.disabled=false;
      if(ok && !opts.silent) toast("Position partagée 📍");
      resolve(!!ok);
    },err=>{ if(btn&&btn.isConnected) btn.disabled=false; if(!opts.silent) toast(err.code===1?"Autorise la localisation dans les réglages du téléphone":"Position introuvable"); resolve(false); },
    {enableHighAccuracy:precise,timeout:20000,maximumAge:precise?60000:600000});
  });
}
// Met la position à jour en silence à l'ouverture (si déjà partagée et autorisée)
async function autoLocation(){
  const l=D.locs[WHO]; if(!l || Date.now()-l.t<5*60000 || !navigator.permissions) return;

}

  let W=0,H=0, strokes=[], cur=null, color="#e8466c", width=4;
  const size=()=>{ const r=wrap.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2); W=r.width; H=r.height; cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); redraw(); };
  const line=s=>{ ctx.strokeStyle=s.c; ctx.lineWidth=s.w; ctx.lineCap="round"; ctx.lineJoin="round"; const p=s.p.map(([x,y])=>[x*W,y*H]);
    ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]); if(p.length===1) ctx.lineTo(p[0][0]+.01,p[0][1]);
    for(let i=1;i<p.length-1;i++){ ctx.quadraticCurveTo(p[i][0],p[i][1],(p[i][0]+p[i+1][0])/2,(p[i][1]+p[i+1][1])/2); }
    if(p.length>1) ctx.lineTo(p[p.length-1][0],p[p.length-1][1]); ctx.stroke(); };
  const redraw=()=>{ ctx.fillStyle="#fff"; ctx.fillRect(0,0,W,H); strokes.forEach(line); if(cur) line(cur); };
  const pos=e=>{ const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height]; };
  cv.addEventListener("pointerdown",e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); cur={c:color,w:width,p:[pos(e)]}; redraw(); });
  cv.addEventListener("pointermove",e=>{ if(!cur) return; e.preventDefault(); cur.p.push(pos(e)); redraw(); });
  const up=()=>{ if(cur){ strokes.push(cur); cur=null; redraw(); } };
  cv.addEventListener("pointerup",up); cv.addEventListener("pointercancel",up);
  requestAnimationFrame(size);
  m.querySelectorAll(".sw").forEach(b=>b.onclick=()=>{ color=b.dataset.c; m.querySelectorAll(".sw").forEach(x=>x.classList.toggle("on",x===b)); });
  m.querySelectorAll("#dwid button").forEach(b=>b.onclick=()=>{ width=+b.dataset.w; m.querySelectorAll("#dwid button").forEach(x=>x.classList.toggle("on",x===b)); });
  m.querySelector("#dundo").onclick=()=>{ strokes.pop(); redraw(); };
  m.querySelector("#dsend").onclick=async e=>{
    if(!strokes.length) return toast("Dessine quelque chose d'abord 🎨");
    const out=document.createElement("canvas"); out.width=640; out.height=640;
    const o=out.getContext("2d"); o.drawImage(cv,0,0,640,640);
    const r=await act("note.add",{text:m.querySelector("#dtx").value,doodle:out.toDataURL("image/jpeg",.85)},e.target);
    if(r){ m.remove(); hearts(8); toast(sentMsg(r)); tab="notes"; LS.set("nd-tab",tab); render(true); }
  };
}

/* ================= Appels audio / vidéo (WebRTC) ================= */
let CALL=null, ICE=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}];
const seenCalls=new Set();
async function callApi(){
  const r=await fetch(`${API}?call=1&who=${WHO}`,{headers:{"X-Code":CODE||""},cache:"no-store"});
  const j=await r.json(); if(!r.ok) throw new Error(j.error||"Erreur");
  if(j.ice) ICE=j.ice; if(j.now) CLOCK=j.now-Date.now();
  return j.call;
}
const waitIce=pc=>new Promise(res=>{
  if(pc.iceGatheringState==="complete") return res();
  const t=setTimeout(res,3000);
  pc.addEventListener("icegatheringstatechange",()=>{ if(pc.iceGatheringState==="complete"){ clearTimeout(t); res(); } });
});
const getMedia=(video,facing="user")=>navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},
  video:video?{facingMode:facing,width:{ideal:720},height:{ideal:1280}}:false});
function newPC(){
  const pc=new RTCPeerConnection({iceServers:ICE});
  pc.ontrack=e=>{ if(!CALL) return; CALL.remote=e.streams[0]; const v=document.querySelector(".callfull video.remote"); if(v && v.srcObject!==CALL.remote){ v.srcObject=CALL.remote; v.play().catch(()=>{}); } };
  pc.onconnectionstatechange=()=>{
    if(!CALL || CALL.pc!==pc) return;
    if(pc.connectionState==="connected" && CALL.state!=="live"){ CALL.state="live"; CALL.since=Date.now(); if(navigator.vibrate) navigator.vibrate(60); callUI(); }
    if(pc.connectionState==="failed") endCall(true,"La connexion a échoué (réseau trop restrictif ?)");
    if(pc.connectionState==="disconnected") setTimeout(()=>{ if(CALL && CALL.pc===pc && pc.connectionState==="disconnected") endCall(true,"Appel coupé"); },8000);
  };
  return pc;
}
async function startCall(video){
  if(CALL) return callUI();
  if(!navigator.mediaDevices || !window.RTCPeerConnection) return toast("Les appels ne sont pas pris en charge sur ce navigateur");
  try{ await callApi(); }catch(e){}
  let stream;
  try{ stream=await getMedia(video); }catch(e){ return toast(video?"Autorise la caméra et le micro dans les réglages":"Autorise le micro dans les réglages"); }
  const pc=newPC(); stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  CALL={pc,local:stream,video,role:"caller",state:"calling",facing:"user",muted:false,camOff:false};
  callUI();
  try{
    await pc.setLocalDescription(await pc.createOffer()); await waitIce(pc);
    if(!CALL || CALL.pc!==pc) return;
    const r=await api("POST",{action:"call.start",offer:pc.localDescription.sdp,video});
    CALL.id=r.callId; seenCalls.add(r.callId); callUI(); pollCall();
  }catch(e){ endCall(false); toast(e.message); }
}
function checkIncomingCall(c,force){
  if(!c || c.to!==WHO || c.state!=="ringing" || !c.offer) return;
  if(CALL || (!force && seenCalls.has(c.id))) return;
  if(Date.now()-c.t>60000) return;
  seenCalls.add(c.id);
  CALL={id:c.id,offer:c.offer,video:c.video,role:"callee",state:"ringing",facing:"user",muted:false,camOff:false,from:c.from};
  callUI(); pollCall();
}
async function acceptCall(){
  if(!CALL || CALL.state!=="ringing") return;
  const c=CALL; c.state="connecting"; callUI();
  try{ await callApi(); }catch(e){}
  let stream;
  try{ stream=await getMedia(c.video); }catch(e){ toast(c.video?"Autorise la caméra et le micro":"Autorise le micro"); return endCall(true); }
  if(CALL!==c){ stream.getTracks().forEach(t=>t.stop()); return; }
  const pc=newPC(); c.pc=pc; c.local=stream; stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  callUI();
  try{
    await pc.setRemoteDescription({type:"offer",sdp:c.offer});
    await pc.setLocalDescription(await pc.createAnswer()); await waitIce(pc);
    await api("POST",{action:"call.answer",id:c.id,answer:pc.localDescription.sdp});
  }catch(e){ toast(e.message); endCall(false); }
}
async function pollCall(){
  const c0=CALL; if(!c0) return;
  try{
    const c=await callApi();
    if(CALL!==c0) return;
    if(!c || c.id!==c0.id || c.state==="ended" || c.state==="missed"){
      const msg=c0.state==="calling"?(c&&c.declined?`${nm(other())} ne peut pas répondre pour le moment 💔`:c&&c.state==="missed"?`${nm(other())} n'a pas répondu`:"Appel terminé")
        :c0.state==="ringing"?`Appel manqué de ${nm(other())}`:"Appel terminé";
      return endCall(false,msg);
    }
    if(c0.role==="caller" && c.state==="accepted" && c.answer && c0.state==="calling"){
      c0.state="connecting"; callUI();
      await c0.pc.setRemoteDescription({type:"answer",sdp:c.answer});
    }
  }catch(e){}
  if(CALL===c0) c0.pollT=setTimeout(pollCall,c0.state==="live"?3000:1000);
}
function endCall(tell,msg){
  const c=CALL; if(!c) return;
  CALL=null;
  clearTimeout(c.pollT); clearInterval(c.timer);
  if(tell!==false && c.id) api("POST",{action:"call.end",id:c.id}).catch(()=>{});
  if(c.local) c.local.getTracks().forEach(t=>t.stop());
  if(c.pc) try{ c.pc.close(); }catch(e){}
  const box=document.querySelector(".callfull"); if(box) box.remove();
  if(navigator.vibrate) navigator.vibrate(0);
  if(msg) toast(msg);
}
async function flipCamera(){
  const c=CALL; if(!c || !c.video || !c.pc) return;
  c.facing=c.facing==="user"?"environment":"user";
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:c.facing,width:{ideal:720},height:{ideal:1280}}});
    const nt=s.getVideoTracks()[0], sender=c.pc.getSenders().find(x=>x.track&&x.track.kind==="video");
    if(sender) await sender.replaceTrack(nt);
    c.local.getVideoTracks().forEach(t=>{ t.stop(); c.local.removeTrack(t); }); c.local.addTrack(nt);
    if(c.camOff) nt.enabled=false;
    callUI();
  }catch(e){ toast("Impossible de changer de caméra"); }
}
function callUI(){
  const c=CALL; if(!c) return;
  let box=document.querySelector(".callfull");
  if(!box){ box=document.createElement("div"); box.className="callfull"; document.body.appendChild(box); }
  const o=c.role==="caller"?other():(c.from||other()), url=avatarUrl(o);
  const live=c.state==="live";
  box.className="callfull"+(c.state==="ringing"||c.state==="calling"?" ringing":"")+(live?" live":"")+(c.video?" vid":"");
  const status={calling:`${c.video?"Appel vidéo":"Appel"}… ça sonne chez ${esc(nm(o))}`,ringing:`t'appelle${c.video?" en vidéo":""} 💕`,connecting:"Connexion…",live:""}[c.state];
  box.innerHTML=`
    ${c.video?`<video class="remote" autoplay playsinline></video>${c.local?`<video class="local" autoplay playsinline muted></video>`:""}`:`<video class="remote" autoplay playsinline style="display:none"></video>`}
    <div class="who"><div class="av" style="${url?`background-image:url('${url}')`:""}">${url?"":esc(nm(o).slice(0,1))}</div>
      <h2>${esc(nm(o))}</h2><p id="cstat">${status}</p></div>
    <div class="callctl">${c.state==="ringing"
      ?`<button class="cbtn red" id="cdecl" aria-label="Refuser">${ICONS.phone}</button><button class="cbtn green" id="cacc" aria-label="Accepter">${c.video?ICONS.video:ICONS.phone}</button>`
      :`<button class="cbtn ${c.muted?"off":""}" id="cmute" aria-label="Micro">${c.muted?"🔇":"🎤"}</button>
        ${c.video?`<button class="cbtn ${c.camOff?"off":""}" id="ccam" aria-label="Caméra">${c.camOff?"🚫":"📷"}</button><button class="cbtn" id="cflip" aria-label="Changer de caméra">🔄</button>`:""}
        <button class="cbtn red" id="chang" aria-label="Raccrocher">${ICONS.phone}</button>`}</div>`;
  const rv=box.querySelector("video.remote"), lv=box.querySelector("video.local");
  if(rv && c.remote){ rv.srcObject=c.remote; rv.play().catch(()=>{}); }
  if(lv && c.local){ lv.srcObject=c.local; lv.style.transform=c.facing==="user"?"scaleX(-1)":"none"; lv.play().catch(()=>{}); }
  const on=(id,f)=>{ const b=box.querySelector(id); if(b) b.onclick=f; };

}

/* ================= Messages vocaux ================= */
const mmss=s=>Math.floor(s/60)+":"+pad(Math.floor(s%60));
const BARS=28;
function bars(id){ let h=0; for(const c of id) h=(h*31+c.charCodeAt(0))>>>0; return Array.from({length:BARS},(_,i)=>{ h=(h*1103515245+12345)>>>0; return 25+((h>>16)%75); }); }
function voiceHTML(n){
  const cur=VP.id===n.id, prog=cur&&VP.audio&&VP.audio.duration?VP.audio.currentTime/VP.audio.duration:0;
  return `<div class="voice" data-voice="${n.id}">
    <button class="vplay" data-vplay="${n.id}" aria-label="Écouter">${cur&&VP.playing?"❚❚":"▶"}</button>
    <div class="vwave" data-vseek="${n.id}">${bars(n.id).map((h,i)=>`<i style="height:${Math.round(6+h*.22)}px" class="${i/BARS<prog?"on":""}"></i>`).join("")}</div>
    <span class="vtime">${cur&&VP.audio?mmss(VP.playing||prog?VP.audio.currentTime:n.dur):mmss(n.dur||0)}</span></div>`;
}
// Lecteur unique, indépendant de l'affichage (la page se redessine régulièrement)
const VP={id:null,audio:null,playing:false,urls:{}};
function voiceUI(){
  $$("[data-voice]").forEach(el=>{
    const id=el.dataset.voice, cur=id===VP.id, a=VP.audio;
    const prog=cur&&a&&a.duration&&isFinite(a.duration)?a.currentTime/a.duration:0;
    el.querySelector(".vplay").textContent=cur&&VP.playing?"❚❚":"▶";
    el.querySelectorAll(".vwave i").forEach((b,i)=>b.classList.toggle("on",cur&&i/BARS<prog));
    const n=D.notes.find(x=>x.id===id);
    el.querySelector(".vtime").textContent=mmss(cur&&a&&(VP.playing||a.currentTime)?a.currentTime:(n&&n.dur)||0);
  });
}
async function playVoice(id,seek){
  const n=D.notes.find(x=>x.id===id); if(!n) return;
  if(VP.id===id && VP.audio && seek==null){ if(VP.playing) VP.audio.pause(); else VP.audio.play(); return; }
  if(VP.audio){ VP.audio.pause(); }
  VP.id=id; VP.playing=false;
  try{
    if(!VP.urls[id]){
      // téléchargé en entier puis lu localement (plus fiable sur iPhone)
      const r=await fetch(`${API}?photo=${id}&k=${n.tk}&s=voice`); if(!r.ok) throw new Error("Vocal introuvable");
      VP.urls[id]=URL.createObjectURL(await r.blob());
    }
    if(VP.id!==id) return;
    const a=new Audio(VP.urls[id]); VP.audio=a;
    a.ontimeupdate=voiceUI;
    a.onplay=()=>{ VP.playing=true; voiceUI(); };
    a.onpause=()=>{ VP.playing=false; voiceUI(); };
    a.onended=()=>{ VP.playing=false; a.currentTime=0; voiceUI(); };
    if(seek!=null) a.addEventListener("loadedmetadata",()=>{ if(isFinite(a.duration)) a.currentTime=seek*a.duration; },{once:true});
    await a.play();
  }catch(e){ VP.playing=false; voiceUI(); toast(e.message||"Lecture impossible"); }
}
function pickMime(){
  const c=["audio/mp4;codecs=mp4a.40.2","audio/mp4","audio/webm;codecs=opus","audio/webm","audio/ogg;codecs=opus"];
  return c.find(t=>window.MediaRecorder && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t))||"";
}
function voiceSheet(){
  if(!navigator.mediaDevices || !window.MediaRecorder) return toast("L'enregistrement vocal n'est pas pris en charge sur ce navigateur");
  const MAX=120;
  let rec=null, stream=null, chunks=[], t0=0, timer=null, blob=null, dur=0, ctx=null, raf=null, preview=null;
  const m=sheet(`<h2>Un vocal pour ${esc(nm(other()))}</h2>
    <div class="rec">
      <div class="rectime" id="vt">0:00</div>
      <div class="level" id="vl">${Array.from({length:24},()=>`<i style="height:4px"></i>`).join("")}</div>
      <button class="recdot" id="vr" aria-label="Enregistrer">🎤</button>
      <p class="faint" id="vh" style="margin:0">Touche pour commencer · 2 min max</p>
    </div>
    <div id="vdone" style="display:none">
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="vre" style="width:auto;flex:none">↺ Recommencer</button><button class="btn ghost grow" id="vlisten">▶ Réécouter</button></div>
      <input type="text" id="vtx" maxlength="200" placeholder="Un petit mot avec ? (optionnel)" style="margin-top:12px">
      <button class="btn" id="vsend" style="margin-top:12px">Envoyer à ${esc(nm(other()))}</button>
    </div>`);
  const stopAll=()=>{ clearInterval(timer); cancelAnimationFrame(raf); if(stream) stream.getTracks().forEach(t=>t.stop()); if(ctx) ctx.close().catch(()=>{}); stream=null; ctx=null; };
  const obs=new MutationObserver(()=>{ if(!document.body.contains(m)){ stopAll(); if(preview) preview.pause(); obs.disconnect(); } });
  obs.observe(document.body,{childList:true});
  const vr=m.querySelector("#vr"), vt=m.querySelector("#vt"), vh=m.querySelector("#vh");
  const start=async()=>{
    try{ stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}}); }
    catch(e){ return toast("Autorise le micro dans les réglages du téléphone"); }
    const mime=pickMime();
    try{ rec=new MediaRecorder(stream,{...(mime?{mimeType:mime}:{}),audioBitsPerSecond:40000}); }catch(e){ rec=new MediaRecorder(stream); }
    chunks=[]; rec.ondataavailable=e=>{ if(e.data&&e.data.size) chunks.push(e.data); };
    rec.onstop=()=>{
      blob=new Blob(chunks,{type:(rec.mimeType||mime||"audio/mp4").split(";")[0]}); stopAll();
      vr.classList.remove("on"); vr.textContent="✓"; vr.disabled=true;
      vh.textContent="Enregistré"; m.querySelector("#vdone").style.display="";
    };
    rec.start(250); t0=Date.now(); vr.classList.add("on"); vr.textContent="■"; vh.textContent="Touche pour arrêter";
    timer=setInterval(()=>{ dur=(Date.now()-t0)/1000; vt.textContent=mmss(dur); if(dur>=MAX) stop(); },200);
    // petit vu-mètre
    try{
      ctx=new (window.AudioContext||window.webkitAudioContext)(); const an=ctx.createAnalyser(); an.fftSize=64;
      ctx.createMediaStreamSource(stream).connect(an); const data=new Uint8Array(an.frequencyBinCount), bs=m.querySelectorAll("#vl i");
      const loop=()=>{ an.getByteFrequencyData(data); bs.forEach((b,i)=>b.style.height=Math.max(4,data[i%data.length]/255*36)+"px"); raf=requestAnimationFrame(loop); }; loop();
    }catch(e){}
  };
  const stop=()=>{ if(rec && rec.state!=="inactive"){ dur=(Date.now()-t0)/1000; rec.stop(); } };
  vr.onclick=()=>{ if(rec && rec.state==="recording") stop(); else if(!blob) start(); };
  m.querySelector("#vre").onclick=()=>{ if(preview) preview.pause(); m.remove(); voiceSheet(); };
  m.querySelector("#vlisten").onclick=e=>{
    if(!blob) return;
    if(preview && !preview.paused){ preview.pause(); e.target.textContent="▶ Réécouter"; return; }
    preview=preview||new Audio(URL.createObjectURL(blob));
    preview.onended=()=>{ e.target.textContent="▶ Réécouter"; };
    preview.play().then(()=>{ e.target.textContent="❚❚ Pause"; }).catch(()=>toast("Lecture impossible"));
  };
  m.querySelector("#vsend").onclick=async e=>{
    if(!blob) return;
    if(blob.size>650000) return toast("Vocal trop long, recommence en plus court");
    e.target.textContent="Envoi…";
    const data=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(blob); });
    const r=await act("note.add",{text:m.querySelector("#vtx").value,voice:data,dur:Math.max(1,Math.round(dur))},e.target);
    if(r){ if(preview) preview.pause(); m.remove(); hearts(8); toast(sentMsg(r)); }
  };
}

    </div>

    <button class="btn" id="write">✍️ Écrire une lettre à ${o}</button>
    ${mine.length?`<div class="card"><div class="eyebrow">Tes lettres pour ${o}</div>
      ${mine.map(l=>`<div class="date"><div class="d"><b>${l.unlock?"À ouvrir le "+fmtDay(parseDay(l.unlock)):"Ouvre quand "+esc(l.label)}</b>
        <div class="faint">${l.openedAt?`✓ Ouverte ${ago(l.openedAt)}`:"Pas encore ouverte"}</div></div>
        <button class="link" data-readmine="${l.id}">Relire</button><button class="x" data-delletter="${l.id}" aria-label="Supprimer">×</button></div>`).join("")}</div>`:""}

    <div class="card center" style="margin-top:22px">
      <div class="eyebrow" style="justify-content:center">🫙 Ton bocal « Pourquoi je t'aime »</div>
      <div class="jar"><div class="lid"></div><div class="glass"><div class="papers">${Array.from({length:papers},(_,i)=>`<span>${["💗","💌","🤍","💕"][i%4]}</span>`).join("")}</div></div></div>
      <p style="margin:0 0 12px;color:var(--text)">${jarLeft?`${plural(jarLeft,"papier")} écrit${jarLeft>1?"s":""} par ${o} ${jarLeft>1?"t'attendent":"t'attend"}`:`Ton bocal est vide pour l'instant… ${o} va le remplir 🥺`}</p>
      <button class="btn" id="drawjar" ${jarLeft?"":"disabled"}>Tirer un papier</button>
      ${D.jar.drawn.length?`<details style="margin-top:14px;text-align:left"><summary>Les raisons que tu as déjà lues (${D.jar.drawn.length})</summary>
        ${D.jar.drawn.map(r=>`<div class="reason">${esc(r.text)}<small>tiré ${ago(r.drawnAt)}</small></div>`).join("")}</details>`:""}
    </div>

    <div class="card">
      <div class="eyebrow">Remplir le bocal de ${o}</div>
      <p style="margin:0 0 10px">Écris une raison pour laquelle tu l'aimes. ${o} la découvrira en tirant un papier.</p>
      <textarea id="jt" maxlength="400" placeholder="J'aime ta façon de…" style="min-height:70px"></textarea>
      <button class="btn" id="jadd" style="margin-top:10px">Glisser dans son bocal</button>
      ${D.jar.mine.length?`<p class="faint" style="margin:12px 0 0">Tu as écrit ${plural(D.jar.mine.length,"raison")} · ${D.jar.mine.filter(r=>!r.drawnAt).length} pas encore lue${D.jar.mine.filter(r=>!r.drawnAt).length>1?"s":""}</p>
        <details style="margin-top:8px"><summary>Voir mes raisons</summary>${D.jar.mine.map(r=>`<div class="reason">${esc(r.text)}<small>${r.drawnAt?"lue "+ago(r.drawnAt):"pas encore lue"} · <button class="link" data-deljar="${r.id}" style="font-size:11px">supprimer</button></small></div>`).join("")}</details>`:""}
    </div>`;
  $$("[data-letter]").forEach(b=>b.onclick=()=>openLetter(b.dataset.letter));
  $$("[data-readmine]").forEach(b=>b.onclick=()=>showLetter(D.letters.find(l=>l.id===b.dataset.readmine)));
  $$("[data-delletter]").forEach(b=>b.onclick=()=>{ if(confirm("Supprimer cette lettre ?")) act("letter.del",{id:b.dataset.delletter}); });
  $$("[data-deljar]").forEach(b=>b.onclick=()=>{ if(confirm("Retirer cette raison du bocal ?")) act("jar.del",{id:b.dataset.deljar}); });
  $("#write").onclick=writeLetter;
  $("#drawjar").onclick=async e=>{
    const r=await act("jar.draw",{},e.currentTarget);
    if(r && r.drawn){ const x=D.jar.drawn.find(y=>y.id===r.drawn); if(x){ hearts(10);
      sheet(`<div class="center"><div class="eyebrow" style="justify-content:center">🫙 Pourquoi je t'aime</div></div>
        <div class="paper unfold" style="margin-top:10px"><div class="body" style="text-align:center">${esc(x.text)}</div><div class="sig">— ${esc(nm(x.from))}</div></div>`); } }
  };
  $("#jadd").onclick=async e=>{ const t=$("#jt").value.trim(); if(!t) return toast("Écris une raison"); const r=await act("jar.add",{text:t},e.target); if(r){ hearts(6); toast("Glissé dans son bocal 🫙"); } };
}
async function openLetter(id){
  const l=D.letters.find(x=>x.id===id); if(!l) return;
  if(l.locked){ const k=daysBetween(todayDate(),parseDay(l.unlock)); return toast(`Patience… elle s'ouvre ${k===1?"demain":"dans "+plural(k,"jour")} 💕`); }
  if(!l.openedAt){ const r=await act("letter.open",{id}); if(!r) return; hearts(12); }
  showLetter(D.letters.find(x=>x.id===id));
}
function showLetter(l){
  if(!l) return;
  sheet(`<div class="paper unfold">
    <div class="hd">${l.unlock?"Lettre du "+fmtDay(parseDay(l.unlock)):"Ouvre quand "+esc(l.label)}</div>
    <div class="body">${esc(l.text)}</div>
    <div class="sig">— ${esc(nm(l.from))}</div></div>`);
}
function writeLetter(){
  let mode="when", label="";
  const m=sheet(`<h2>Une lettre pour ${esc(nm(other()))}</h2>
    <div class="seg" id="lm" style="margin-top:14px"><button data-v="when" class="on">Ouvre quand…</button><button data-v="date">À une date précise</button></div>
    <div id="lwhen" style="margin-top:12px">
      <div class="chipsel">${WHEN.map(w=>`<button data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
      <input type="text" id="lcustom" maxlength="80" placeholder="…ou écris ta propre situation" style="margin-top:8px">
    </div>
    <div id="ldate" style="margin-top:12px;display:none">
      <p style="margin:0 0 6px">${esc(nm(other()))} ne pourra l'ouvrir qu'à partir de ce jour-là (anniversaire, retrouvailles…).</p>
      <input type="date" id="lday" min="${ymd(new Date(Date.now()+86400000))}">
    </div>
    <textarea id="ltext" class="writepaper" maxlength="5000" placeholder="Mon amour…" style="margin-top:14px;width:100%;border-radius:10px"></textarea>
    <button class="btn" id="lsend" style="margin-top:14px">Sceller et envoyer 💌</button>`);
  m.querySelectorAll("#lm button").forEach(b=>b.onclick=()=>{ mode=b.dataset.v; m.querySelectorAll("#lm button").forEach(x=>x.classList.toggle("on",x===b));
    m.querySelector("#lwhen").style.display=mode==="when"?"":"none"; m.querySelector("#ldate").style.display=mode==="date"?"":"none"; });
  m.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{ label=b.dataset.w; m.querySelector("#lcustom").value=""; m.querySelectorAll("[data-w]").forEach(x=>x.classList.toggle("on",x===b)); });
  m.querySelector("#lcustom").oninput=()=>{ label=""; m.querySelectorAll("[data-w]").forEach(x=>x.classList.remove("on")); };
  m.querySelector("#lsend").onclick=async e=>{
    const text=m.querySelector("#ltext").value.trim();
    const lab=mode==="when"?(label||m.querySelector("#lcustom").value.trim().replace(/^ouvre quand\s*/i,"")):"";
    const unlock=mode==="date"?m.querySelector("#lday").value:"";
    if(mode==="when" && !lab) return toast("Choisis quand l'ouvrir");
    if(mode==="date" && !unlock) return toast("Choisis la date");
    if(!text) return toast("Écris ta lettre");
    const r=await act("letter.add",{text,label:lab,unlock},e.target);
    if(r){ m.remove(); hearts(10); toast(sentMsg(r)); }
  };
}

/* ================= Question du jour ================= */
function questionTab(){
  const q=D.qa, o=nm(other());
  $("#page").innerHTML=`
    <div class="card glow" style="margin-top:14px">
      <div class="eyebrow" style="justify-content:center">Question du jour</div>
      <div class="question">${esc(q.question)}</div>
    </div>
    ${q.mine?`
      <div class="answer"><div class="n">Toi</div><div class="a">${esc(q.mine)}</div></div>
      ${q.theirs?`<div class="answer them"><div class="n">${esc(o)}</div><div class="a">${esc(q.theirs)}</div></div>`
        :`<p class="center">${esc(o)} n'a pas encore répondu… elle/il sera prévenu·e ⏳</p>`}
      <details style="margin-top:8px"><summary>Modifier ma réponse</summary>
        <textarea id="qa" maxlength="600" style="margin-top:10px">${esc(q.mine)}</textarea><button class="btn small" id="qs" style="margin-top:10px">Enregistrer</button></details>
    `:`
      ${q.theirAnswered?`<div class="answer them"><div class="n">${esc(o)} a déjà répondu 👀</div><div class="a locked">Réponds d'abord pour découvrir sa réponse</div></div>`:""}
      <textarea id="qa" maxlength="600" placeholder="Ta réponse…"></textarea>
      <button class="btn" id="qs" style="margin-top:12px">Envoyer ma réponse</button>
      <p class="center faint" style="margin-top:10px">Vous découvrez la réponse de l'autre une fois la vôtre envoyée.</p>`}
    ${q.history.length?`<div class="card"><div class="eyebrow">Vos réponses précédentes</div>
      ${q.history.map(h=>`<details style="border-bottom:1px solid var(--stroke);padding:10px 0"><summary style="color:var(--text);font-weight:500">${fmtDay(parseDay(h.day))} · <i style="font-family:var(--serif);font-size:18px">${esc(h.q)}</i></summary>
        <div class="answer"><div class="n">${esc(nm("dali"))}</div><div class="a">${esc(h.dali)}</div></div>
        <div class="answer them"><div class="n">${esc(nm("rahma"))}</div><div class="a">${esc(h.rahma)}</div></div></details>`).join("")}</div>`:""}`;
  $("#qs").onclick=async e=>{ const t=$("#qa").value.trim(); if(!t) return toast("Écris ta réponse"); if(await act("qa.answer",{day:q.day,text:t},e.target)) hearts(5); };
}

/* ================= Réglages ================= */
function settings(){
  const st={on:"Activées sur ce téléphone ✓",off:"Désactivées",denied:"Bloquées dans les réglages du téléphone","needs-install":"Installe d'abord l'appli sur l'écran d'accueil",unsupported:"Non disponibles sur ce navigateur",unknown:"…"}[PUSH];
  const m=sheet(`<h2>Réglages</h2>
    <div class="stack" style="margin-top:14px">
      <div class="card" style="margin:0"><div class="eyebrow">🔔 Notifications</div><p style="margin:0 0 12px;color:var(--text)">${st}</p>
        ${PUSH==="on"?`<div class="row"><button class="btn small ghost" id="ptest">Tester</button><button class="btn small ghost" id="poff">Désactiver</button></div>`
          :PUSH==="off"?`<button class="btn" id="pon">Activer les notifications</button>`
          :PUSH==="needs-install"?`<button class="btn" id="pinst">Comment installer l'appli ?</button>`:""}
        <p class="faint" style="margin:10px 0 0">${D.push.theirs?`${esc(nm(other()))} les a activées ✓`:`${esc(nm(other()))} ne les a pas encore activées.`}</p></div>
      <div><div class="faint" style="margin-bottom:6px">Sur ce téléphone, je suis</div>
        <div class="seg" id="sw">${Object.entries(PEOPLE).map(([k,v])=>`<button data-v="${k}" class="${k===WHO?"on":""}">${esc(v)}</button>`).join("")}</div></div>
      <div class="card" style="margin:0"><div class="eyebrow">🗺️ Ma position sur la carte</div>
        <p style="margin:0 0 10px;color:var(--text)">${D.locs[WHO]?`Partagée ✓ · ${D.locs[WHO].precise===false?"approximative (~1 km)":"précise"} · mise à jour à chaque ouverture`:"Pas partagée."}</p>
        <div class="seg" id="sprec" style="margin-bottom:10px"><button data-v="1" class="${getPrecise()?"on":""}">📍 Précise</button><button data-v="0" class="${getPrecise()?"":"on"}">≈ Ville (~1 km)</button></div>
        ${D.locs[WHO]?`<div class="row"><button class="btn small ghost" id="locup">Mettre à jour</button><button class="btn small ghost" id="locoff">Ne plus partager</button></div>`:`<button class="btn" id="locon">Partager ma position</button>`}</div>
      <div class="card" style="margin:0"><div class="row" style="gap:14px"><div class="avatarbig" style="width:56px;height:56px;font-size:22px;${avatarUrl(WHO)?`background-image:url('${avatarUrl(WHO)}')`:""}">${avatarUrl(WHO)?"":esc(nm(WHO).slice(0,1))}</div>
        <div class="grow"><b>Ta photo sur la carte</b><div class="faint">${avatarUrl(WHO)?"Ajoutée ✓":"Pas encore de photo"}</div></div><button class="btn small ghost" id="avbtn">${avatarUrl(WHO)?"Changer":"Ajouter"}</button></div></div>
      <button class="btn ghost" id="inst">📲 Installer l'appli sur l'écran d'accueil</button>
      <button class="btn ghost" id="out">Se déconnecter</button>
    </div>`);
  const on=(s,f)=>{ const el=m.querySelector(s); if(el) el.onclick=f; };
  on("#pon",e=>{ enablePush(e.currentTarget).then(()=>m.remove()); });
  on("#poff",()=>{ m.remove(); disablePush(); });
  on("#ptest",async e=>{ const r=await act("push.test",{},e.currentTarget); toast(r&&r.pushed?"Notification envoyée 🔔":"Aucune notification envoyée"); });
  on("#pinst",()=>{ m.remove(); installHelp(true); });
  on("#inst",()=>{ m.remove(); installHelp(false); });
  m.querySelectorAll("#sw button").forEach(b=>b.onclick=async()=>{
    if(b.dataset.v===WHO) return;
    try{ const s=swReg && await swReg.pushManager.getSubscription(); if(s){ await act("push.unsub",{endpoint:s.endpoint}); await s.unsubscribe(); } }catch(e){}
    WHO=b.dataset.v; LS.set("nd-who",WHO); m.remove(); await checkPush(); refresh(true);
  });
  const prec=()=>m.querySelector("#sprec .on").dataset.v==="1";
  m.querySelectorAll("#sprec button").forEach(b=>b.onclick=()=>m.querySelectorAll("#sprec button").forEach(x=>x.classList.toggle("on",x===b)));
  on("#locon",e=>shareLocation(e.currentTarget,{precise:prec()}).then(ok=>ok&&m.remove()));
  on("#locup",e=>shareLocation(e.currentTarget,{precise:prec()}).then(ok=>ok&&m.remove()));
  on("#avbtn",()=>{ m.remove(); avatarSheet(); });
  on("#locoff",async()=>{ if(await act("loc.clear",{})){ m.remove(); toast("Position retirée"); } });
  on("#out",()=>{ m.remove(); logout(); });
}

/* ================= Démarrage ================= */
(async function boot(){
  await Promise.race([initSW(), new Promise(r=>setTimeout(r,2500))]);
  try{
    const r=await fetch(API+"?status=1",{cache:"no-store"}); const j=await r.json();
    if(!r.ok) throw new Error(j.error||"Serveur indisponible");
    PEOPLE=j.people||PEOPLE; VAPID=j.vapid||null;
    if(!j.configured) return setupScreen();
    if(!CODE) return loginScreen();
    if(!WHO || !PEOPLE[WHO]){
      try{ await api("GET"); whoScreen(); }catch(e){ if(e.status===401) logout(); else toast(e.message); }
      return;
    }
    start();
  }catch(e){
    app.innerHTML=`<div class="solo center"><div style="font-size:52px">🌧️</div><h2>Oups</h2><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">Réessayer</button></div>`;
  }
})();
</script>
